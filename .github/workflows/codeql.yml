# CodeQL: análisis estático de los scripts de Python y de los workflows. Solo acciones de GitHub (sin terceros).
name: CodeQL
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 6 * * 1" }]
permissions:
  contents: read
jobs:
  analizar:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.lenguaje }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.lenguaje }}"

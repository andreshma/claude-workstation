# CI for the claude-workstation kit: Lint → SAST/secrets → Test on every push and PR.
# Build/DAST/Deploy do not apply: the kit is scripts and configuration that install.sh copies to HOME.
# Third-party actions: none. GitHub's own actions are pinned by commit SHA with the version as a comment (Dependabot
# keeps both current); tools are installed with a pinned version and checksum (WS-SEC-016, WS-SEC-017).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: read the repo only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, Python, JSON, tmux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux >/dev/null
      # Every script with a bash/sh shebang, from the kit and from files/.
      - name: shellcheck
        run: |
          mapfile -t f < <(git ls-files | while read -r p; do
            [[ -f "$p" ]] && head -c 64 "$p" | head -1 | grep -qE '^#!.*\b(bash|sh)\b' && echo "$p"; done)
          echo "Scripts: ${#f[@]}"
          shellcheck -S warning -x "${f[@]}"
      # mapfile + a single call: a `while … && …` leaves the status of the last file (not Python = false failure).
      - name: Python compiles
        run: |
          mapfile -t f < <(git ls-files | while read -r p; do [[ -f "$p" ]] && head -1 "$p" | grep -q '^#!.*python' && echo "$p"; done)
          echo "Python: ${#f[@]} files"
          (( ${#f[@]} == 0 )) || python3 -m py_compile "${f[@]}"
      - name: Valid JSON
        run: git ls-files '*.json' | xargs -r -n1 jq empty
      # Syntax only (source-file -n): does not run the configuration's hooks or if-shell, which depend on your machine.
      - name: tmux validates the configuration and the menus
        run: |
          export HOME="$PWD/files/home" TERM=xterm-256color
          conf="$HOME/.tmux.conf"
          [[ -f "$conf" ]] || { echo "no .tmux.conf in the kit"; exit 0; }
          grep -vE '^[[:space:]]*run(-shell)?\b' "$conf" > /tmp/tmux.conf
          # A single server, started with retries (on the runner it sometimes dies at startup without a terminal);
          # then each file is validated separately with source-file -n (syntax only).
          for i in 1 2 3; do
            tmux -L ci -f /dev/null new-session -d -s ci "sleep 300" 2>/dev/null && tmux -L ci has-session -t ci 2>/dev/null && break
            sleep 1
          done
          tmux -L ci has-session -t ci
          tmux -L ci source-file -n /tmp/tmux.conf
          n=0
          for m in "$HOME"/.config/tmux-claude/menu*.tmux; do
            [[ -f "$m" ]] || continue
            tmux -L ci source-file -n "$m"; n=$((n + 1))
          done
          tmux -L ci kill-server
          echo "tmux: configuration and $n menus ok"

  sast:
    name: SAST and secrets (bandit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      BANDIT_VERSION: 1.7.10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bandit (medium severity or higher)
        run: |
          python3 -m pip install --quiet "bandit==${BANDIT_VERSION}"
          mapfile -t f < <(git ls-files | while read -r p; do [[ -f "$p" ]] && head -1 "$p" | grep -q '^#!.*python' && echo "$p"; done)
          (( ${#f[@]} == 0 )) || python3 -m bandit -ll "${f[@]}"
      - name: gitleaks (official binary verified by checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz" && curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tgz}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner .

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ZIZMOR_VERSION: 1.33.1
      ZIZMOR_SHA256: 3e6a301c7a820a2501915f5a9de8c0486da82bdec7965f068477538a98743d43
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Official release binary, verified against the sha256 GitHub records for the asset (pinned here).
      - name: zizmor (template injection, unpinned uses, excessive permissions, credential persistence)
        run: |
          tgz=zizmor-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${tgz}"
          echo "${ZIZMOR_SHA256}  ${tgz}" | sha256sum -c -
          tar -xzf "$tgz" zizmor
          ./zizmor --offline --min-severity low .github/workflows/

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Third-party components the kit installs or calls (WS-SEC-018); release.yml attaches it to each release.
      - name: Generate and validate
        run: |
          python3 .github/scripts/sbom.py -o sbom.cdx.json
          python3 .github/scripts/sbom.py --check sbom.cdx.json
          jq -r '.components[] | [.name, (.version // "-")] | @tsv' sbom.cdx.json | column -t | head -100

  test:
    name: Kit tests
    runs-on: ubuntu-24.04
    needs: [lint, sast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux >/dev/null
      - name: tests/run.sh
        run: bash tests/run.sh

  suites:
    name: Security suites (tests/*.sh)
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # age and zstd for the encrypted backups; npm (already on the runner) for the pinned packages; tmux for the
      # tests/run.sh cases that tests/compliance.sh runs as control checks; bubblewrap for the live part of
      # tests/mcp-jail.sh (skipped, not failed, where the runner forbids unprivileged user namespaces).
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux age zstd bubblewrap >/dev/null
      # Every standalone suite except run.sh (the test job runs it); all of them run, the job fails if one does.
      # tests/compliance.sh is the continuous compliance evidence (WS-GOV-005) and tests/ai-bom.sh keeps the AI-BOM
      # in step with the kit (WS-GOV-002).
      - name: guard, hooks, audit, memory, spend, solo, supply chain, Telegram, backups, gate, interop, compliance, AI-BOM
        run: |
          git config --global user.email ci@example.invalid; git config --global user.name ci
          failed=()
          for t in tests/*.sh; do
            [[ "$t" == tests/run.sh ]] && continue
            echo "::group::$t"
            bash "$t" || failed+=("$t")
            echo "::endgroup::"
          done
          (( ${#failed[@]} == 0 )) || { echo "Failed: ${failed[*]}"; exit 1; }

  install:
    name: Clean install (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    # Blocking (WS-SEC-017): behaviour tests on a fresh install fail the run like every other job.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux zstd >/dev/null
      - name: install.sh in an empty HOME
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          git config --global user.email ci@example.invalid; git config --global user.name ci
          # No Windows side and no Claude Code on the runner: the user is given and the MCP servers are skipped.
          bash install.sh --dry-run --win-user ci --no-mcp | tail -5
          bash install.sh --win-user ci --no-mcp
          echo "Installed in ~/.local/bin: $(ls "$HOME/.local/bin" | wc -l)"
      - name: ws-test on the installed files
        run: |
          export HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/home/.local/bin:$PATH" TERM=xterm-256color
          ws-test

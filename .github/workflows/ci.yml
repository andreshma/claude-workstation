# CI for the claude-workstation kit: Lint → SAST/secrets → Test on every push and PR.
# Build/DAST/Deploy do not apply: the kit is scripts and configuration that install.sh copies to HOME.
# Third-party actions: none. Tools are installed with a pinned version and checksum.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read            # least privilege: read the repo only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, Python, JSON, tmux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux >/dev/null
      # Every script with a bash/sh shebang, from the kit and from files/.
      - name: shellcheck
        run: |
          mapfile -t f < <(git ls-files | while read -r p; do
            [[ -f "$p" ]] && head -c 64 "$p" | head -1 | grep -qE '^#!.*\b(bash|sh)\b' && echo "$p"; done)
          echo "Scripts: ${#f[@]}"
          shellcheck -S warning -x "${f[@]}"
      # mapfile + a single call: a `while … && …` leaves the status of the last file (not Python = false failure).
      - name: Python compiles
        run: |
          mapfile -t f < <(git ls-files | while read -r p; do [[ -f "$p" ]] && head -1 "$p" | grep -q '^#!.*python' && echo "$p"; done)
          echo "Python: ${#f[@]} files"
          (( ${#f[@]} == 0 )) || python3 -m py_compile "${f[@]}"
      - name: Valid JSON
        run: git ls-files '*.json' | xargs -r -n1 jq empty
      # Syntax only (source-file -n): does not run the configuration's hooks or if-shell, which depend on your machine.
      - name: tmux validates the configuration and the menus
        run: |
          export HOME="$PWD/files/home" TERM=xterm-256color
          conf="$HOME/.tmux.conf"
          [[ -f "$conf" ]] || { echo "no .tmux.conf in the kit"; exit 0; }
          grep -vE '^[[:space:]]*run(-shell)?\b' "$conf" > /tmp/tmux.conf
          # A single server, started with retries (on the runner it sometimes dies at startup without a terminal);
          # then each file is validated separately with source-file -n (syntax only).
          for i in 1 2 3; do
            tmux -L ci -f /dev/null new-session -d -s ci "sleep 300" 2>/dev/null && tmux -L ci has-session -t ci 2>/dev/null && break
            sleep 1
          done
          tmux -L ci has-session -t ci
          tmux -L ci source-file -n /tmp/tmux.conf
          n=0
          for m in "$HOME"/.config/tmux-claude/menu*.tmux; do
            [[ -f "$m" ]] || continue
            tmux -L ci source-file -n "$m"; n=$((n + 1))
          done
          tmux -L ci kill-server
          echo "tmux: configuration and $n menus ok"

  sast:
    name: SAST y secretos (bandit, gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
      BANDIT_VERSION: 1.7.10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: bandit (medium severity or higher)
        run: |
          python3 -m pip install --quiet "bandit==${BANDIT_VERSION}"
          mapfile -t f < <(git ls-files | while read -r p; do [[ -f "$p" ]] && head -1 "$p" | grep -q '^#!.*python' && echo "$p"; done)
          (( ${#f[@]} == 0 )) || python3 -m bandit -ll "${f[@]}"
      - name: gitleaks (official binary verified by checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tgz" && curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tgz}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tgz" gitleaks
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner .

  test:
    name: Pruebas del kit
    runs-on: ubuntu-24.04
    needs: [lint, sast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux >/dev/null
      - name: tests/run.sh
        run: bash tests/run.sh

  instalacion:
    name: Instalación limpia (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    # First version: reports without blocking the merge; becomes required once it runs stably.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq tmux zstd >/dev/null
      - name: install.sh in an empty HOME
        run: |
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          git config --global user.email ci@example.invalid; git config --global user.name ci
          bash install.sh --dry-run | tail -5
          bash install.sh
          echo "Installed in ~/.local/bin: $(ls "$HOME/.local/bin" | wc -l)"
      - name: ws-test on the installed files
        run: |
          export HOME="$RUNNER_TEMP/home" PATH="$RUNNER_TEMP/home/.local/bin:$PATH" TERM=xterm-256color
          ws-test

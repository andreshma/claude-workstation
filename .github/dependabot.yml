# Keeps the CI's GitHub actions up to date (actions/checkout). One PR per week at most.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A single PR for all actions: the CodeQL steps (init, analyze) must be bumped together,
    # or the run fails on mismatched versions.
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci

# .gitleaks.toml — gitleaks default rules + reviewed exceptions.
# Only files that CONTAIN detection patterns or fake test data, never real secrets.
# Every addition is reviewed in the PR (same criterion as secrets-allow.txt).
title = "claude-workstation"

[extend]
useDefault = true

[allowlist]
description = "Detection patterns and fake test data"
paths = [
  '''tests/run\.sh''',                                   # fake AccountKey to test that export blocks secrets
  '''files/home/\.claude/hooks/guard\.sh''',             # patterns the guard blocks
  '''files/home/\.local/bin/ws-test''',                  # fake tokens assembled at run time
  '''files/home/\.local/bin/ws-telegram''',              # redaction self-test
  '''files/home/\.local/bin/ws-history''',               # secret search patterns
  '''files/home/\.config/tmux-claude/ai-shell\.sh''',    # redaction rules
]

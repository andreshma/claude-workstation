# ~/.tmux.conf — Claude Code multi-repo · WSL + Windows Terminal

# --- 1. Terminal and Claude Code requirements --------------------------------
set -g  default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g  allow-passthrough on              # notifications and progress bar to Windows Terminal
set -s  extended-keys on                  # Shift+Enter = line break in Claude
set -as terminal-features 'xterm*:extkeys'
set -s  escape-time 10                    # Esc interrupts Claude without delay
set -g  focus-events on                   # Claude knows whether you are looking at its pane
set -s  set-clipboard on                  # copy in tmux = Windows clipboard (OSC 52)

# --- 2. Ergonomics -----------------------------------------------------------
set -g  mouse on
set -g  history-limit 100000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  display-time 2000
setw -g mode-keys vi
setw -g automatic-rename-format '#{b:pane_current_path}'   # window name = folder
set -g  set-titles on
set -g  set-titles-string '#S · #W'

bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind r   source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- 3. Layouts: Claude 65% + side shell, or tiled ---------------------------
setw -g main-pane-width 65%
bind M select-layout main-vertical
bind T select-layout tiled
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_index}: #{b:pane_current_path} '

# --- 4. Tabs on top and alerts (Claude BEL) ----------------------------------
set -g  status-position top
set -g  status-justify left
set -g  status-interval 15
set -g  status-style 'bg=colour235,fg=colour250'
set -g  status-left ''
set -g  status-left-length 20
set -g  status-right '#[fg=colour255,bg=colour60] ≡ menu #[default] #(~/.local/bin/tmux-watch)#{?client_prefix,#[reverse] PREFIX · h help #[noreverse] ,}%H:%M '
setw -g window-status-separator ''
setw -g window-status-format         ' #I #{=18:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?window_zoomed_flag, [Z],}#{?window_bell_flag, !,} '
setw -g window-status-current-format ' #I #{=18:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?window_zoomed_flag, [Z],} '
setw -g window-status-style          'fg=colour250,bg=colour237'
setw -g window-status-current-style  'fg=black,bg=green,bold'
setw -g window-status-bell-style     'fg=black,bg=yellow,bold'
setw -g monitor-bell on
set -g  bell-action any

# --- 5. Finder (tabs, active, favorites, recent): Ctrl+b f -------------------
bind f display-popup -E -w 92% -h 80% -T ' Find ' "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-find"

# --- 6. Persistence: saves every 5 min and restores when tmux starts (AT THE END) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"claude->claude-resume"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# --- Floating shell in the repo folder: Ctrl+b g (bash) · Ctrl+b P (PowerShell) ---
bind g display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "~/.local/bin/tmux-popup-run --persistent env WS_TAB=#{window_id} bash -l"
bind P display-popup -E -w 80% -h 75% ~/.local/bin/tmux-popup-run ~/.local/bin/tmux-pwsh

# --- Status bar: active Azure subscription + git branch of the tab ---
# Every segment has a fixed width (tmux-watch and tmux-fit pad and cut their output; @res_c is fixed by tmux-res): a
# value that changes never moves the tab list. The tab's CPU and RAM (@res_c) show here when the monitor line is
# hidden (Menu → Settings → tab resources, tmux-res mode).
set -g status-right-length 80
set -g status-right '#[fg=colour255,bg=colour60] ≡ menu #[default] #(~/.local/bin/tmux-watch)#{?#{||:#{==:#{@ws_res_mode},compact},#{&&:#{==:#{@ws_res_mode},full},#{!=:#{status},2}}}, #{E:@res_c},} #[fg=#{@t_az}]#(~/.local/bin/tmux-fit 18 -- ~/.local/bin/tmux-az-name) #[fg=#{@t_branch}]#(~/.local/bin/tmux-fit 16 -- git -C #{q:pane_current_path} branch --show-current) #[default]%H:%M '

# --- Alt+1…9: go straight to the tab without the prefix ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Claude agent state in the tabs (hooks + status line) ---
# Fixed slots: the name is cut AND padded (14/18 columns), the state is one 2-column slot (⏳ stalled · ● Claude in its
# colour · ! bell · blank), the context one 4-column slot (" 62%" or blank) and the current tab's state text 18
# columns: a timer ticking, a bell or the context growing never changes the width of a tab, so the list never shifts.
setw -g window-status-format         ' #I #{p14:#{=14:window_name}}#{?#{@cstall},#[fg=#{@t_tool}]⏳,#{?#{@cs},#[fg=#{@csc}] ●,#{?window_bell_flag, !,  }}}#{?#{@cctx},#[fg=#{@cctxc}]#{p-4:#{@cctx}%},    }#[fg=default] '
setw -g window-status-current-format ' #I #{p18:#{=18:window_name}}#{?#{@cs}, #[fg=#{@csc}]● #{p18:#{=18:#{@cs}}},}#{?#{@cctx}, #[fg=#{@cctxc}]ctx#{p-5:#{@cctx}%},}#[fg=default]#{?window_zoomed_flag, [Z],} '
setw -g window-status-current-style  'fg=colour255,bg=colour238,bold'

# --- Productivity: repos, review, CI, logs ---
bind o display-popup -E -w 80% -h 70% "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-open"
bind G display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "lazygit"
bind K display-popup -E -w 90% -h 80% -d "#{pane_current_path}" \
  "gh pr checks 2>/dev/null || gh run list -L 15; echo; read -rsn1 -p 'Press a key to close'"
bind Y run-shell "tmux capture-pane -pJ -S -200 -t '#{pane_id}' | tmux load-buffer -w - && tmux display 'Last 200 lines copied to the clipboard'"
bind H run-shell "mkdir -p ~/logs" \; pipe-pane -o "cat >> ~/logs/#{session_name}-#{window_name}-$(date +%Y%m%d-%H%M%S).log" \; \
  display "Tab log turned on/off (~/logs)"

# --- Tab dashboard: Ctrl+b D ---
bind D display-popup -E -w 90% -h 70% "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-dash"
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-recover --validate; ~/.local/bin/tmux-backup'
# --- Live subagents: Ctrl+b A ---
bind A display-popup -E -w 90% -h 70% "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-agents"

# --- Everyday shortcuts: Ctrl+b h ---
bind h display-popup -E -w 92% -h 80% "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-help"

# --- Workstation menu: Ctrl+b m, click on the status bar (right side) and right click on a tab ---
bind m source-file ~/.config/tmux-claude/menu.tmux
bind -n MouseDown1StatusRight source-file ~/.config/tmux-claude/menu.tmux
bind -n MouseDown3Status display-menu -T "#[align=centre] #{window_index} #{window_name} " -t = -x W -y W \
  "Rename"                                            n "command-prompt -I \"#W\" \"rename-window -- '%%'\"" \
  "Close tab"                                         x "confirm-before -p \"Close tab #W? (y/n)\" kill-window" \
  '' \
  "#{?#{>:#{session_windows},1},,-}Move left"            l "swap-window -t:-1" \
  "#{?#{>:#{session_windows},1},,-}Move right"           r "swap-window -t:+1" \
  '' \
  "Save session"                                      s "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh"
set -g status-right-length 160

# --- Fast navigation across many tabs (no prefix) ---
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-S-Left  run-shell "tmux swap-window -d -t -1 && tmux select-window -t '#{window_id}'"
bind -n M-S-Right run-shell "tmux swap-window -d -t +1 && tmux select-window -t '#{window_id}'"
bind -n M-0 last-window
bind -n M-s display-popup -E -w 92% -h 80% -T ' Find ' "~/.local/bin/tmux-popup-run ~/.local/bin/tmux-find"

# --- Theme (dark/light/automatic) and screensaver: tmux-theme, tmux-saver ---
set-hook -g client-attached 'run-shell -b "~/.local/bin/tmux-theme apply"'
run-shell -b '~/.local/bin/tmux-theme apply'

# --- Language selector (ws-lang): @ws_lang is what Menu → Workstation → Language shows ---
run-shell -b '~/.local/bin/ws-lang --sync'

# --- Continuous saving: besides continuum (every minute), saves when the structure changes ---
set-hook -g after-new-window   'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g window-unlinked    'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g after-rename-window 'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g pane-exited        'run-shell -b "~/.local/bin/tmux-save-now"'
# The server may be started without ~/.local/bin in PATH (from Windows Terminal, without a login shell): the kit's
# scripts call each other by name, so it is added once for everything the server runs.
run-shell 'case ":$PATH:" in *":$HOME/.local/bin:"*) ;; *) tmux set-environment -g PATH "$HOME/.local/bin:$PATH" ;; esac'
# Remembers the last save before something overwrites it at startup (tmux-recover).
run-shell '~/.local/bin/tmux-recover --mark-startup'
# --- Tab summary (patch 37): double click on the tab or Ctrl+b i ---
bind -n DoubleClick1Status display-popup -E -w 84% -h 70% -T ' Tab summary ' '~/.local/bin/tmux-popup-run ~/.local/bin/tmux-summary'
bind i display-popup -E -w 84% -h 70% -T ' Tab summary ' '~/.local/bin/tmux-popup-run ~/.local/bin/tmux-summary'

# --- Tab groups (patch 50): one tmux session per group (repos, code, downloads…) ---
bind -n M-Up   switch-client -p          # previous group
bind -n M-Down switch-client -n          # next group
bind S choose-tree -sZ -O name           # all groups with their tabs
set -g status-left "#{?#{==:#{session_name},dev},,#[bold][#S] #[default]}"
set -g status-left-length 24

run '~/.tmux/plugins/tpm/tpm'
# If the session came up empty at startup, restores the marked save (backup for continuum).
run-shell -b '~/.local/bin/tmux-recover --auto-startup'

# --- Audit 2026-11-18 ---
set -g detach-on-destroy off      # closing a session moves you to another one instead of dropping you out of tmux
setw -g aggressive-resize on      # each client uses its own size (useful with several terminals)

# Patch 52: palette, pane → Claude, notify me, extract, quick question, labels
source-file -q ~/.config/tmux-claude/extras.tmux

# Patch 58: menu/popup style, monitor (Ctrl+b v) and the finder views (Ctrl+b a active, Ctrl+b j recent)
source-file -q ~/.config/tmux-claude/ux.tmux

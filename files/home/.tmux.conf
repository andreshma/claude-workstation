# ~/.tmux.conf — Claude Code multi-repo · WSL + Windows Terminal

# --- 1. Terminal y requisitos de Claude Code ---------------------------------
set -g  default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g  allow-passthrough on              # notificaciones y progress bar hacia Windows Terminal
set -s  extended-keys on                  # Shift+Enter = salto de línea en Claude
set -as terminal-features 'xterm*:extkeys'
set -s  escape-time 10                    # Esc interrumpe a Claude sin retraso
set -g  focus-events on                   # Claude sabe si estás viendo su pane
set -s  set-clipboard on                  # copiar en tmux = portapapeles de Windows (OSC 52)

# --- 2. Ergonomía ------------------------------------------------------------
set -g  mouse on
set -g  history-limit 100000
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on
set -g  display-time 2000
setw -g mode-keys vi
setw -g automatic-rename-format '#{b:pane_current_path}'   # nombre de ventana = carpeta
set -g  set-titles on
set -g  set-titles-string '#S · #W'

bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind r   source-file ~/.tmux.conf \; display "tmux.conf recargado"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- 3. Layouts: Claude 65% + shell lateral, o mosaico -----------------------
setw -g main-pane-width 65%
bind M select-layout main-vertical
bind T select-layout tiled
setw -g pane-border-status top
setw -g pane-border-format ' #{pane_index}: #{b:pane_current_path} '

# --- 4. Pestañas arriba y alertas (BEL de Claude) ----------------------------
set -g  status-position top
set -g  status-justify left
set -g  status-interval 15
set -g  status-style 'bg=colour235,fg=colour250'
set -g  status-left ''
set -g  status-left-length 20
set -g  status-right '#[fg=colour255,bg=colour60] ≡ menú #[default] #(~/.local/bin/tmux-watch)#{?client_prefix,#[reverse] PREFIX · h ayuda #[noreverse] ,}%H:%M '
setw -g window-status-separator ''
setw -g window-status-format         ' #I #{=18:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?window_zoomed_flag, [Z],}#{?window_bell_flag, !,} '
setw -g window-status-current-format ' #I #{=18:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?window_zoomed_flag, [Z],} '
setw -g window-status-style          'fg=colour250,bg=colour237'
setw -g window-status-current-style  'fg=black,bg=green,bold'
setw -g window-status-bell-style     'fg=black,bg=yellow,bold'
setw -g monitor-bell on
set -g  bell-action any

# --- 5. Selector de ventanas: Ctrl+b f ---------------------------------------
bind f display-popup -E -w 85% -h 75% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-pick"

# --- 6. Persistencia: guarda cada 5 min y restaura al iniciar tmux (AL FINAL) --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'laktak/extrakto'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes '"claude->claude-resume"'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'

# --- Shell flotante en la carpeta del repo: Ctrl+b g (bash) · Ctrl+b P (PowerShell) ---
bind g display-popup -E -w 80% -h 75% -d "#{pane_current_path}" "~/.local/bin/tmux-flot-run --persistente env PESTANA=#{window_id} bash -l"
bind P display-popup -E -w 80% -h 75% ~/.local/bin/tmux-flot-run ~/.local/bin/tmux-pwsh

# --- Barra: suscripción de Azure activa + rama git de la pestaña ---
set -g status-right-length 80
set -g status-right '#[fg=colour255,bg=colour60] ≡ menú #[default] #(~/.local/bin/tmux-watch)#[fg=#{@t_az}]#(az account show --query name -o tsv 2>/dev/null) #[fg=#{@t_branch}]#(git -C #{q:pane_current_path} branch --show-current 2>/dev/null) #[default]%H:%M '

# --- Alt+1…9: ir directo a la pestaña sin prefix ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Estado de agentes Claude en las pestañas (hooks + status line) ---
setw -g window-status-format         ' #I #{=14:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?#{@cs}, #[fg=#{@csc}]●,}#{?#{@csub}, #[fg=#{@t_agent}]◆#{@csub},}#{?#{@cctx}, #[fg=#{@cctxc}]#{@cctx}%,}#[fg=default]#{?window_bell_flag, !,} '
setw -g window-status-current-format ' #I #{=18:window_name}#{?#{@cstall}, #[fg=#{@t_tool}]⏳#[fg=default],}#{?#{@cs}, #[fg=#{@csc}]● #{@cs},}#{?#{@cctx}, #[fg=#{@cctxc}]ctx #{@cctx}%,}#[fg=default]#{?window_zoomed_flag, [Z],} '
setw -g window-status-current-style  'fg=colour255,bg=colour238,bold'

# --- Productividad: repos, revisión, CI, logs ---
bind o display-popup -E -w 80% -h 70% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-open"
bind G display-popup -E -w 95% -h 90% -d "#{pane_current_path}" "lazygit"
bind K display-popup -E -w 90% -h 80% -d "#{pane_current_path}" \
  "gh pr checks 2>/dev/null || gh run list -L 15; echo; read -rsn1 -p 'Tecla para cerrar'"
bind Y run-shell "tmux capture-pane -pJ -S -200 -t '#{pane_id}' | tmux load-buffer -w - && tmux display 'Últimas 200 líneas copiadas al portapapeles'"
bind H run-shell "mkdir -p ~/logs" \; pipe-pane -o "cat >> ~/logs/#{session_name}-#{window_name}-$(date +%Y%m%d-%H%M%S).log" \; \
  display "Log de pestaña activado/desactivado (~/logs)"

# --- Tablero de pestañas: Ctrl+b D ---
bind D display-popup -E -w 90% -h 70% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-dash"
set -g @resurrect-hook-post-save-all '~/.local/bin/tmux-recuperar --validar; ~/.local/bin/tmux-backup'
# --- Subagentes en vivo: Ctrl+b A ---
bind A display-popup -E -w 90% -h 70% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-agents"

# --- Atajos de uso diario: Ctrl+b h ---
bind h display-popup -E -w 92% -h 80% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-help"

# --- Menú de la estación: Ctrl+b m, clic en la barra (derecha) y clic derecho en una pestaña ---
bind m source-file ~/.config/tmux-claude/menu.tmux
bind -n MouseDown1StatusRight source-file ~/.config/tmux-claude/menu.tmux
bind -n MouseDown3Status display-menu -T "#[align=centre] #{window_index} #{window_name} " -t = -x W -y W \
  "Renombrar"                                         n "command-prompt -I \"#W\" \"rename-window -- '%%'\"" \
  "Cerrar pestaña"                                    x "confirm-before -p \"¿Cerrar la pestaña #W? (y/n)\" kill-window" \
  '' \
  "#{?#{>:#{session_windows},1},,-}Mover a la izquierda" l "swap-window -t:-1" \
  "#{?#{>:#{session_windows},1},,-}Mover a la derecha"   r "swap-window -t:+1" \
  '' \
  "Guardar sesión"                                    s "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh" \
  "Subagentes en vivo"                                A "display-popup -E -w 90% -h 70% ~/.local/bin/tmux-flot-run ~/.local/bin/tmux-agents"
set -g status-right-length 160

# --- Navegación rápida entre muchas pestañas (sin prefijo) ---
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-S-Left  run-shell "tmux swap-window -d -t -1 && tmux select-window -t '#{window_id}'"
bind -n M-S-Right run-shell "tmux swap-window -d -t +1 && tmux select-window -t '#{window_id}'"
bind -n M-0 last-window
bind -n M-s display-popup -E -w 85% -h 75% "~/.local/bin/tmux-flot-run ~/.local/bin/tmux-pick"

# --- Tema (oscuro/claro/automático) y protector de pantalla: tmux-theme, tmux-saver ---
set-hook -g client-attached 'run-shell -b "~/.local/bin/tmux-theme apply"'
run-shell -b '~/.local/bin/tmux-theme apply'

# --- Guardado continuo: además de continuum (cada minuto), guarda al cambiar la estructura ---
set-hook -g after-new-window   'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g after-split-window 'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g window-unlinked    'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g after-rename-window 'run-shell -b "~/.local/bin/tmux-save-now"'
set-hook -g pane-exited        'run-shell -b "~/.local/bin/tmux-save-now"'
# Recuerda el último guardado antes de que algo lo pise al arrancar (tmux-recuperar).
run-shell '~/.local/bin/tmux-recuperar --marcar-arranque'
# --- Resumen de una pestaña (parche 37): doble clic en la pestaña o Ctrl+b i ---
bind -n DoubleClick1Status display-popup -E -w 84% -h 70% -T ' Resumen de la pestaña ' '~/.local/bin/tmux-flot-run ~/.local/bin/tmux-resumen'
bind i display-popup -E -w 84% -h 70% -T ' Resumen de la pestaña ' '~/.local/bin/tmux-flot-run ~/.local/bin/tmux-resumen'

# --- Grupos de pestañas (parche 50): una sesión tmux por grupo (repos, code, downloads…) ---
bind -n M-Up   switch-client -p          # grupo anterior
bind -n M-Down switch-client -n          # grupo siguiente
bind S choose-tree -sZ -O name           # todos los grupos con sus pestañas
set -g status-left "#{?#{==:#{session_name},dev},,#[bold][#S] #[default]}"
set -g status-left-length 24

run '~/.tmux/plugins/tpm/tpm'
# Si al arrancar la sesión quedó vacía, restaura el guardado marcado (respaldo de continuum).
run-shell -b '~/.local/bin/tmux-recuperar --auto-arranque'

# --- Auditoría 2026-11-18 ---
set -g detach-on-destroy off      # cerrar una sesión te pasa a otra en vez de sacarte de tmux
setw -g aggressive-resize on      # cada cliente usa su tamaño (útil con varias terminales)

# Parche 52: paleta, panel → Claude, avísame, extraer, pregunta rápida, etiquetas
source-file -q ~/.config/tmux-claude/maravillas.tmux

# Parche 58: estilo de menús/flotantes, monitor (Ctrl+b v) y activas (Ctrl+b a)
source-file -q ~/.config/tmux-claude/ux.tmux

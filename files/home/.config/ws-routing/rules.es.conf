# rules.es.conf — Spanish alternatives of the routing rules in rules.conf (ADR-009). Read only with `ws-lang es`.
#
# The Spanish in this file is DATA, not interface text: these expressions match prompts typed in Spanish.
# Format: id|regular expression (bash ERE; compared in lowercase). The id is the one of the rule in rules.conf;
# the level and the order (first match wins) come from there. A rule matches if its English expression OR this
# one matches. An id that is not in rules.conf is ignored.  Test changes:  WS_LANG=es cr --test

architecture|(arquitectura|modelo de amenazas|redise[nñ]a|dise[nñ]a (la|el|una|un) (soluci[oó]n|sistema|plataforma|arquitectura))
deep-analysis|(an[aá]lisis (exhaustivo|completo|profundo)|estrategia t[eé]cnica|evaluaci[oó]n de (alternativas|proveedores))
mass-change|(migraci[oó]n (grande|completa|de (la )?plataforma)|refactor(iza)? (grande|global|masivo)|todo el (repo|proyecto|c[oó]digo))
sql|(procedimiento almacenado|consulta (a la (base|bd)|de base de datos))
debugging|(depura|excepci[oó]n|no funciona|falla|fuga de memoria)
security|(seguridad|secretos)
release|(despliegue)
scoped|(renombra|formatea|mensaje de commit|traduce)
search|^(busca|buscar|encuentra|d[oó]nde (est[aá]|se define|se usa)|lista(r)? (los|las|el|la)|qu[eé] archivos|cu[aá]nt[oa]s )

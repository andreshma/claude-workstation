# rules.conf — model routing by task (ADR-009). Used by `cr` and the ws-routing.sh hook (a single table).
#
# Format: level|id|regular expression (bash ERE; compared in lowercase). The FIRST one that matches wins,
# in the order of this file. With no match: level opus (the default); the hook only asks when
# a rule matches, so it does not interrupt with tasks that cannot be classified.
# Levels: fable · opus · sonnet · haiku.  Test changes:  cr --test   ·   cr --explain "your task"
# Language: these expressions are English. With `ws-lang es`, rules.es.conf (next to this file) adds the Spanish
# alternatives of the same ids: a rule then matches if its expression here OR its expression there matches.

# --- Fable: architecture and exhaustive analysis -------------------------------------------------------
fable|architecture|(architecture|\badr\b|\bc4\b|threat model|redesign|design (the|a|an) (solution|system|platform|architecture))
fable|deep-analysis|((exhaustive|complete|full|deep|in-depth) analysis|due diligence|furps|technical strategy|evaluation of (alternatives|vendors|providers))
fable|mass-change|((large|full|complete|platform) migration|migration of the (whole |entire )?platform|(large|global|massive|repo-wide) refactor|(whole|entire) (repo|project|codebase))

# --- Sonnet: SQL (before debugging: "fix the error in the query" is SQL) --------------------------------
sonnet|sql|(\bsql\b|\bt-sql\b|\bkql\b|\bselect\b.*\bfrom\b|stored procedure|\bjoin\b|database query|query (to|against) the (database|db))

# --- Opus: debugging, security and releases -------------------------------------------------------------
opus|debugging|(debug|stack ?trace|exception|does not work|doesn't work|not working|\bfail(s|ing|ed)?\b|\berror\b|\bbug\b|race condition|memory leak)
opus|security|(vulnerab|owasp|\bcve-|pentest|hardening|security|\bsecrets\b)
opus|release|(\brelease\b|\bdeploy|rollback|pipeline)

# --- Sonnet: narrowly scoped changes and short texts ----------------------------------------------------
sonnet|scoped|(\btypo\b|\brename\b|\bformat\b|\blint\b|one[- ]pager|commit message|changelog|translate)

# --- Haiku: searches and simple questions about the code ------------------------------------------------
haiku|search|^(find|search for|where (is|are|do|does)|list (the|all)|which files|what files|how many )

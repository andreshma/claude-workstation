# Rotation periods of the kit's secrets in Windows Credential Manager (WS-GOV-010): «name=days». ws-audit warns when
# a ws/<name> secret was last written longer ago than its period (ws-secret ages). The defaults follow
# docs/governance/REVIEW-CADENCE.md (Telegram yearly); confirm or change them, here or from Menu > Settings.
# The backup key (age-backup) is rotated only on suspicion of exposure, so it has no period.
telegram-bot-token=365
telegram-pin=365

# plugins.lock — TPM and every tmux plugin of ~/.tmux.conf pinned by commit (WS-SEC-016). ws-plugins apply (run by
# install.sh and ws-update instead of TPM's install_plugins and update_plugins) clones each one and checks out exactly
# this commit; a plugin that cannot be put at its commit, or whose files were changed, is moved out of
# ~/.tmux/plugins so tmux does not load it (WS_PLUGINS_ALLOW_UNPINNED=1 keeps it, logged and audited).
# To move a pin: review the upstream diff between the two commits, change the commit here and run
# bash tests/supply-tools.sh.

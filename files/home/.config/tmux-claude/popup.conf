# popup.conf — tmux for the floating windows (server "-L popup", started by tmux-popup-run).
# Goal: a popup should work like a normal tab.

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g escape-time 10
set -g history-limit 50000
set -g mouse on                      # wheel = scroll; drag = select
set -g set-clipboard on              # also sends what was copied to the terminal (OSC 52)
set -g focus-events on
set -g exit-empty on

# Copy on mouse release or with Enter/y in copy mode → Windows clipboard.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/ws-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/ws-copy"
bind -T copy-mode    Enter             send -X copy-pipe-and-cancel "~/.local/bin/ws-copy"
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "~/.local/bin/ws-copy"
# Search without entering copy mode first: Ctrl+b / .
bind / copy-mode \; send -X search-backward-incremental ""

# Minimal status bar with the usage help.
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left ""
set -g status-right " wheel: scroll · drag: copy · Ctrl+b /: search · q: leave scroll · Shift+click: URL · Ctrl+b d: close "
set -g status-right-length 140
set -g window-status-format ""
set -g window-status-current-format ""

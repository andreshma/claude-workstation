# flot.conf — tmux de las ventanas flotantes (servidor "-L flot", lo arranca tmux-flot-run).
# Objetivo: que una flotante se use como una pestaña normal.

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g escape-time 10
set -g history-limit 50000
set -g mouse on                      # rueda = scroll; arrastrar = seleccionar
set -g set-clipboard on              # además manda lo copiado al terminal (OSC 52)
set -g focus-events on
set -g exit-empty on

# Copiar al soltar el mouse o con Enter/y en modo copia → portapapeles de Windows.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/ws-copiar"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/ws-copiar"
bind -T copy-mode    Enter             send -X copy-pipe-and-cancel "~/.local/bin/ws-copiar"
bind -T copy-mode-vi y                 send -X copy-pipe-and-cancel "~/.local/bin/ws-copiar"
# Buscar sin entrar primero a modo copia: Ctrl+b / .
bind / copy-mode \; send -X search-backward-incremental ""

# Barra mínima con la ayuda de uso.
set -g status on
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"
set -g status-left ""
set -g status-right " rueda: scroll · arrastrar: copiar · Ctrl+b /: buscar · q: salir del scroll · Shift+clic: URL · Ctrl+b d: cerrar "
set -g status-right-length 140
set -g window-status-format ""
set -g window-status-current-format ""

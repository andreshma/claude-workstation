# reglas.conf — ruteo de modelos por tarea (ADR-009). La usan `cr` y el hook ws-ruteo.sh (una sola tabla).
#
# Formato: nivel|id|expresión regular (ERE de bash; se compara en minúsculas). Gana la PRIMERA que coincide,
# en el orden de este archivo. Sin coincidencia: nivel opus (por defecto); el hook solo pregunta cuando
# coincide una regla, para no interrumpir con tareas que no se pueden clasificar.
# Niveles: fable · opus · sonnet · haiku.  Probar cambios:  cr --probar   ·   cr --explica "tu tarea"

# --- Fable: arquitectura y análisis exhaustivo ---------------------------------------------------------
fable|arquitectura|(arquitectura|architecture|\badr\b|\bc4\b|threat model|modelo de amenazas|redise[nñ]a|dise[nñ]a (la|el|una|un) (soluci[oó]n|sistema|plataforma|arquitectura))
fable|analisis-exhaustivo|(an[aá]lisis (exhaustivo|completo|profundo)|due diligence|furps|estrategia t[eé]cnica|evaluaci[oó]n de (alternativas|proveedores))
fable|cambio-masivo|(migraci[oó]n (grande|completa|de (la )?plataforma)|refactor(iza)? (grande|global|masivo)|todo el (repo|proyecto|c[oó]digo))

# --- Sonnet: SQL (antes que depuración: "corrige el error en la consulta" es SQL) -----------------------
sonnet|sql|(\bsql\b|\bt-sql\b|\bkql\b|\bselect\b.*\bfrom\b|stored procedure|procedimiento almacenado|\bjoin\b|consulta (a la (base|bd)|de base de datos))

# --- Opus: depuración, seguridad y entregas -------------------------------------------------------------
opus|depuracion|(debug|depura|stack ?trace|excepci[oó]n|exception|no funciona|falla|\berror\b|\bbug\b|race condition|fuga de memoria|memory leak)
opus|seguridad|(vulnerab|owasp|\bcve-|pentest|hardening|seguridad|secretos)
opus|entrega|(\brelease\b|despliegue|\bdeploy|rollback|pipeline)

# --- Sonnet: cambios acotados y textos cortos -----------------------------------------------------------
sonnet|acotado|(\btypo\b|renombra|formatea|\blint\b|one[- ]pager|mensaje de commit|changelog|traduce)

# --- Haiku: búsquedas y preguntas simples sobre el código -----------------------------------------------
haiku|busqueda|^(busca|buscar|encuentra|d[oó]nde (est[aá]|se define|se usa)|lista(r)? (los|las|el|la)|qu[eé] archivos|cu[aá]nt[oa]s )

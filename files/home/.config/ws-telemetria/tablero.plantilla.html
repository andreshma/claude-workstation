<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>Consumo de Claude</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1f1e1b; --muted: #6b675f; --line: #e3e0d8;
    --acc: #c4643a; --acc2: #3b6e8f; --ok: #3f7d4e; --warn: #b07b1f; --bar: #c4643a; --bar2: #8fb3c9;
    --s1: #c4643a; --s2: #3b6e8f; --s3: #3f7d4e; --s4: #b07b1f; --s5: #7a5ea8; --s6: #9a968d; --bad: #b3402e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161513; --panel: #1f1e1b; --ink: #ece9e2; --muted: #a39e93; --line: #34322d;
            --acc: #e08a5c; --acc2: #7fb0cf; --ok: #7cbf8b; --warn: #e0b45c; --bar: #e08a5c; --bar2: #4f7891;
            --s1: #e08a5c; --s2: #7fb0cf; --s3: #7cbf8b; --s4: #e0b45c; --s5: #b39ddb; --s6: #8f8a80; --bad: #e58a78; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { padding: 20px 24px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; }
  main { padding: 8px 24px 32px; display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); max-width: 1500px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  @media (max-width: 1000px) { .c3, .c4 { grid-column: span 6; } .c6, .c8 { grid-column: span 12; } }
  @media (max-width: 600px) { main, header { padding-left: 16px; padding-right: 16px; } .c3, .c4 { grid-column: span 12; } }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .kpi { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .fila { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.texto { text-align: left; max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
  .tabla { overflow-x: auto; }
  .chip { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; background: var(--line); color: var(--muted); }
  .barra { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; display: flex; }
  .barra span { display: block; height: 100%; }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  svg text { fill: var(--muted); font-size: 10px; }
  .seccion { grid-column: span 12; margin: 10px 0 -4px; font-size: 15px; font-weight: 600; }
  .seccion small { font-weight: 400; color: var(--muted); margin-left: 8px; font-size: 12.5px; }
  .comp { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 20px; }
  .comp b { display: block; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .comp span { color: var(--muted); font-size: 12px; }
  .delta { font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .delta.sube { color: var(--warn); } .delta.baja { color: var(--ok); } .delta.mal { color: var(--bad); } .delta.neutro { color: var(--muted); }
  .nota { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .vacio { color: var(--muted); padding: 12px 0; }
  footer { grid-column: span 12; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Consumo de Claude</h1>
  <span class="sub" id="gen"></span>
</header>
<main id="app"></main>
<script>
const D = /*__DATOS__*/null;
const $ = (s) => document.querySelector(s);
const n = (x) => (x || 0).toLocaleString("es-MX");
const k = (x) => x >= 1e9 ? (x / 1e9).toFixed(2) + " B" : x >= 1e6 ? (x / 1e6).toFixed(1) + " M" : x >= 1e3 ? (x / 1e3).toFixed(1) + " k" : String(x || 0);
const usd = (x) => "$" + (x || 0).toLocaleString("es-MX", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function card(cls, titulo, html) { return `<section class="card ${cls}"><h2>${titulo}</h2>${html}</section>`; }
function tabla(cols, filas) {
  if (!filas.length) return `<div class="vacio">Sin datos todavía.</div>`;
  return `<div class="tabla"><table><thead><tr>${cols.map((c) => `<th>${c[0]}</th>`).join("")}</tr></thead><tbody>${
    filas.map((f) => `<tr>${cols.map((c, i) => `<td class="${i === 0 ? "texto" : ""}">${c[1](f)}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}
function barras(dias) {
  const W = 720, H = 150, m = 22, bw = (W - m) / dias.length;
  const max = Math.max(1, ...dias.map((d) => d.costo));
  const rects = dias.map((d, i) => {
    const h = (H - 26) * d.costo / max, x = m + i * bw, y = H - 18 - h;
    return `<rect x="${x + 1}" y="${y}" width="${bw - 2}" height="${h}" rx="2" fill="var(--bar)"><title>${d.dia}: ${usd(d.costo)} · ${k(d.tokens)} tokens · ${d.turnos} turnos</title></rect>` +
      (i % 5 === 0 ? `<text x="${x}" y="${H - 4}">${d.dia.slice(5)}</text>` : "");
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Costo equivalente por día">${rects}<text x="0" y="10">${usd(max)}</text></svg>`;
}

// ---- Tendencias: gráficas SVG a mano (sin librerías), con el valor en <title> y los extremos impresos ----
const SER = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)"];
const dur = (s) => s >= 3600 ? (s / 3600).toFixed(1) + " h" : s >= 90 ? Math.round(s / 60) + " min" : Math.round(s || 0) + " s";
const sem = (f) => f.inicio.slice(8) + "/" + f.inicio.slice(5, 7);
function leyenda(nombres) { return `<div class="leyenda">${nombres.map((x, i) => `<span><i style="background:${SER[i % SER.length]}"></i>${esc(x)}</span>`).join("")}</div>`; }
// Cambio contra el periodo anterior. sentido: +1 si subir es bueno, -1 si subir es malo, 0 si solo informa.
function delta(a, b, sentido, fmt) {
  if (!b && !a) return `<span class="delta neutro">sin datos</span>`;
  if (!b) return `<span class="delta neutro">nuevo</span>`;
  const p = 100 * (a - b) / b, fl = p > 0.5 ? "▲" : p < -0.5 ? "▼" : "＝";
  const cls = Math.abs(p) <= 0.5 || !sentido ? "neutro" : (p > 0) === (sentido > 0) ? "baja" : sentido < 0 ? "sube" : "mal";
  return `<span class="delta ${cls}">${fl} ${Math.abs(p).toFixed(0)}% <span class="neutro">(antes ${fmt(b)})</span></span>`;
}
// Barras apiladas por periodo. claves = series en orden; pct = normaliza cada barra a 100 %.
function apiladas(filas, claves, campo, etiqueta, pct, fmt) {
  const W = 720, H = 190, mi = 46, mb = 20, mt = 12, bw = (W - mi) / Math.max(1, filas.length);
  const tot = filas.map((f) => claves.reduce((a, c) => a + (f[campo][c] || 0), 0));
  const max = pct ? 100 : Math.max(1, ...tot), alto = H - mb - mt;
  let g = "";
  for (const fr of [0, 0.5, 1]) {
    const y = mt + alto * (1 - fr);
    g += `<line x1="${mi}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${mi - 6}" y="${y + 3}" text-anchor="end">${pct ? Math.round(100 * fr) + "%" : fmt(max * fr)}</text>`;
  }
  filas.forEach((f, i) => {
    let y = mt + alto; const x = mi + i * bw;
    claves.forEach((c, j) => {
      const v = f[campo][c] || 0; if (!v) return;
      const h = alto * (pct ? (tot[i] ? 100 * v / tot[i] : 0) : v) / max; y -= h;
      g += `<rect x="${x + 2}" y="${y}" width="${Math.max(1, bw - 4)}" height="${h}" fill="${SER[j % SER.length]}"${f.parcial ? ' opacity=".6"' : ""}><title>${etiqueta(f)} · ${esc(c)}: ${fmt(v)}${pct && tot[i] ? " (" + Math.round(100 * v / tot[i]) + "%)" : ""} · total ${fmt(tot[i])}</title></rect>`;
    });
    if (!pct && tot[i] && bw > 34) g += `<text x="${x + bw / 2}" y="${y - 3}" text-anchor="middle">${fmt(tot[i])}</text>`;
    if (filas.length <= 14 || i % 2 === 0) g += `<text x="${x + bw / 2}" y="${H - 5}" text-anchor="middle">${etiqueta(f)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Barras apiladas por periodo">${g}</svg>`;
}
// Líneas punto a punto. series = [{nombre, valores}], con el último valor impreso al final de cada línea.
function lineas(etiquetas, series, fmt, tope) {
  const W = 720, H = 180, mi = 46, md = 64, mb = 20, mt = 12, alto = H - mb - mt, ancho = W - mi - md;
  const max = tope || Math.max(1, ...series.flatMap((s) => s.valores)) * 1.08;
  const px = (i) => mi + (etiquetas.length > 1 ? ancho * i / (etiquetas.length - 1) : ancho / 2), py = (v) => mt + alto * (1 - v / max);
  let g = "";
  for (const fr of [0, 0.5, 1]) g += `<line x1="${mi}" x2="${W - md}" y1="${py(max * fr)}" y2="${py(max * fr)}" stroke="var(--line)"/><text x="${mi - 6}" y="${py(max * fr) + 3}" text-anchor="end">${fmt(max * fr)}</text>`;
  const paso = Math.ceil(etiquetas.length / 8);
  etiquetas.forEach((e, i) => { if (i % paso === 0) g += `<text x="${px(i)}" y="${H - 5}" text-anchor="middle">${esc(e)}</text>`; });
  const finales = [];
  series.forEach((s, j) => {
    const c = SER[j % SER.length];
    g += `<polyline fill="none" stroke="${c}" stroke-width="2" points="${s.valores.map((v, i) => px(i) + "," + py(v)).join(" ")}"/>`;
    s.valores.forEach((v, i) => { g += `<circle cx="${px(i)}" cy="${py(v)}" r="${i === s.valores.length - 1 ? 3.5 : 2}" fill="${c}"><title>${esc(etiquetas[i])} · ${esc(s.nombre)}: ${fmt(v)}</title></circle>`; });
    finales.push({ y: py(s.valores[s.valores.length - 1] || 0), t: fmt(s.valores[s.valores.length - 1] || 0), c });
  });
  finales.sort((a, b) => a.y - b.y).forEach((f, i, a) => { if (i && f.y - a[i - 1].y < 12) f.y = a[i - 1].y + 12; });   // que no se encimen
  for (const f of finales) g += `<text x="${W - md + 8}" y="${f.y + 3}" style="fill:${f.c};font-weight:600">${f.t}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Líneas por periodo">${g}</svg>`;
}
// Mapa de horas: filas = días (lunes primero), columnas = hora local.
function calor(M) {
  const W = 720, mi = 30, mt = 14, cw = (W - mi) / 24, ch = 20, H = mt + ch * 7 + 4, max = Math.max(1, ...M.flat());
  const dias = ["lun", "mar", "mié", "jue", "vie", "sáb", "dom"];
  let g = "";
  for (let h = 0; h < 24; h += 3) g += `<text x="${mi + h * cw + 2}" y="10">${String(h).padStart(2, "0")} h</text>`;
  M.forEach((fila, d) => {
    g += `<text x="0" y="${mt + d * ch + 14}">${dias[d]}</text>`;
    fila.forEach((v, h) => {
      g += `<rect x="${mi + h * cw + 1}" y="${mt + d * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="2" fill="${v ? "var(--s1)" : "var(--line)"}" opacity="${v ? (0.18 + 0.82 * v / max).toFixed(2) : 1}"><title>${dias[d]} ${String(h).padStart(2, "0")}:00 · ${n(v)} turnos</title></rect>`;
    });
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Turnos por día de la semana y hora">${g}</svg>`;
}
// ---- OpenTelemetry (colector local ws-otel): API, permisos, tiempo activo, hooks, subagentes ----
const ms = (x) => x == null ? "—" : x >= 1000 ? (x / 1000).toFixed(1) + " s" : Math.round(x) + " ms";
function otel(O, h) {
  h.push(`<div class="seccion">API, permisos y tiempo activo<small>OpenTelemetry de Claude Code, guardado en tu máquina por ws-otel${O && O.desde ? " · desde " + esc(O.desde) : ""}</small></div>`);
  if (!O || !O.api) {
    h.push(card("c12", "Sin señales todavía", `<div class="vacio">El colector no ha recibido nada. Revisa <code>ws-otel estado</code> y reinicia tus pestañas de Claude (/exit y claude -c): la exportación se activa al arrancar.</div>`));
    return;
  }
  const A = O.api, C = O.codigo || {}, act = O.activo || [];
  const tuyo = act.reduce((a, d) => a + d.tuyo_min, 0), cl = act.reduce((a, d) => a + d.claude_min, 0);
  const comp = [
    ["Llamadas a la API", n(A.llamadas), `<span class="delta neutro">${usd(A.costo)} equiv.</span>`],
    ["Duración típica", ms(A.med_ms), `<span class="delta neutro">p95 ${ms(A.p95_ms)}</span>`],
    ["Primer token", ms(A.ttft_med_ms), `<span class="delta neutro">p95 ${ms(A.ttft_p95_ms)}</span>`],
    ["Errores de API", A.error_pct + "%", `<span class="delta ${A.errores ? "sube" : "neutro"}">${n(A.errores)} errores · ${n(A.agotados)} sin más reintentos</span>`],
    ["Tiempo activo tuyo", (tuyo / 60).toFixed(1) + " h", `<span class="delta neutro">Claude: ${(cl / 60).toFixed(1)} h</span>`],
    ["Esperando tu aprobación", (A.espera_total_min || 0) + " min", `<span class="delta neutro">${n(A.espera_n || 0)} diálogos · típico ${ms(A.espera_med_ms)}</span>`],
    ["Código", "+" + n(C.lineas_mas) + " / −" + n(C.lineas_menos), `<span class="delta neutro">${n(C.commits)} commits · ${n(C.prs)} PR</span>`],
  ];
  h.push(card("c12", `Últimos ${O.dias} días`, `<div class="comp">${comp.map((c) => `<div><span>${c[0]}</span><b>${c[1]}</b>${c[2]}</div>`).join("")}</div>
    <div class="nota">Tiempo activo: el tuyo es mientras escribes o lees; el de Claude, mientras responde o corre herramientas. «Primer token» es lo que tarda el modelo en empezar a contestar.</div>`));
  const Dd = (O.api_dias || []).filter((d) => d.llamadas);
  if (Dd.length > 1) h.push(card("c6", "Duración de las llamadas a la API por día", lineas(Dd.map((d) => d.dia.slice(8) + "/" + d.dia.slice(5, 7)),
    [{ nombre: "mediana", valores: Dd.map((d) => d.med_ms || 0) }, { nombre: "p95", valores: Dd.map((d) => d.p95_ms || 0) }], ms) + leyenda(["mediana", "p95"])));
  if (act.length > 1) h.push(card("c6", "Tiempo activo por día (minutos)", lineas(act.map((d) => d.dia.slice(8) + "/" + d.dia.slice(5, 7)),
    [{ nombre: "tuyo", valores: act.map((d) => d.tuyo_min) }, { nombre: "Claude", valores: act.map((d) => d.claude_min) }], (x) => Math.round(x) + " min") + leyenda(["tuyo", "Claude"])));
  h.push(card("c6", "API por modelo", tabla([["Modelo", (f) => esc(f.modelo)], ["Llamadas", (f) => n(f.llamadas)], ["Mediana", (f) => ms(f.med_ms)], ["p95", (f) => ms(f.p95_ms)], ["Costo", (f) => usd(f.costo)]], O.api_modelos || [])));
  h.push(card("c6", "Costo por origen de la llamada", tabla([["Origen", (f) => esc(f.origen)], ["Llamadas", (f) => n(f.n)], ["Costo", (f) => usd(f.costo)]], O.api_origen || [])));
  h.push(card("c4", "Errores de API por código", tabla([["Código", (f) => esc(f.codigo)], ["Veces", (f) => n(f.n)]], O.errores || [])));
  h.push(card("c4", "Quién decide los permisos", tabla([["Fuente", (f) => esc(f.fuente)], ["Acepta", (f) => n(f.acepta)], ["Rechaza", (f) => n(f.rechaza)]], O.permisos || []) +
    `<div class="nota">config = una regla tuya · hook = un hook · user_* = tú, en el diálogo.</div>`));
  h.push(card("c4", "Herramientas más rechazadas", tabla([["Herramienta", (f) => esc(f.herramienta)], ["Rechazos", (f) => n(f.n)]], O.rechazos || [])));
  h.push(card("c6", "Cuánto tardan tus hooks", tabla([["Hook", (f) => esc(f.evento)], ["Veces", (f) => n(f.n)], ["Mediana", (f) => ms(f.med_ms)], ["p95", (f) => ms(f.p95_ms)], ["Total", (f) => f.total_s + " s"]], O.hooks || [])));
  h.push(card("c6", "Subagentes terminados", tabla([["Tipo", (f) => esc(f.tipo)], ["Veces", (f) => n(f.n)], ["Duración típica", (f) => ms(f.med_ms)], ["Tokens", (f) => k(f.tokens)], ["Herramientas", (f) => n(f.herramientas)]], O.subagentes || [])));
  const K = O.compactaciones || {};
  h.push(card("c4", "Compactaciones", `<div class="kpi">${n(K.n)}<small>${n(K.auto)} automáticas</small></div>
    <div class="fila"><span>antes: ${k(K.antes_med || 0)} tokens</span><span>después: ${k(K.despues_med || 0)}</span></div><div class="fila"><span>duración típica: ${ms(K.med_ms)}</span></div>`));
  h.push(card("c4", "Conexiones a servidores MCP", tabla([["Servidor", (f) => esc(f.servidor)], ["Estado", (f) => esc(f.estado)], ["Veces", (f) => n(f.n)]], O.mcp || [])));
  h.push(card("c4", "Skills activadas", tabla([["Skill", (f) => esc(f.skill)], ["Cómo", (f) => esc(f.origen)], ["Veces", (f) => n(f.n)]], O.skills || [])));
}
function tendencias(T, h) {
  if (!T || !T.semanas || !T.semanas.some((f) => f.turnos)) return;
  const A = T.actual, B = T.anterior, S = T.semanas;
  h.push(`<div class="seccion">Tendencias<small>hora local · datos desde ${esc(T.desde)} (${n(T.dias_con_datos)} días con actividad)</small></div>`);
  const comp = [
    ["Costo equivalente", usd(A.costo), delta(A.costo, B.costo, -1, usd)],
    ["Turnos tuyos", n(A.turnos), delta(A.turnos, B.turnos, 0, n)],
    ["Sesiones", n(A.sesiones), delta(A.sesiones, B.sesiones, 0, n)],
    ["Costo por turno", usd(A.turnos ? A.costo / A.turnos : 0), delta(A.turnos ? A.costo / A.turnos : 0, B.turnos ? B.costo / B.turnos : 0, -1, usd)],
    ["Entrada desde caché", A.cache_pct + "%", delta(A.cache_pct, B.cache_pct, 1, (x) => x + "%")],
    ["Turno típico (mediana)", dur(A.dur_p50), delta(A.dur_p50, B.dur_p50, -1, dur)],
    ["Turno lento (p90)", dur(A.dur_p90), delta(A.dur_p90, B.dur_p90, -1, dur)],
    ["Costo en subagentes", A.sub_pct + "%", delta(A.sub_pct, B.sub_pct, 0, (x) => x + "%")],
    ["Costo en trabajo automático", (A.auto_pct || 0) + "%", delta(A.auto_pct || 0, B.auto_pct || 0, 0, (x) => x + "%")],
  ];
  h.push(card("c12", "Últimos 7 días frente a los 7 anteriores", `<div class="comp">${comp.map((c) => `<div><span>${c[0]}</span><b>${c[1]}</b>${c[2]}</div>`).join("")}</div>
    <div class="nota">Un turno tuyo empieza con un mensaje que escribiste. El trabajo automático es lo que Claude hace sin que escribas: retomar cuando termina una tarea en segundo plano, avisos del sistema o una compactación (${n(A.turnos_auto || 0)} veces en estos 7 días).</div>`));
  h.push(card("c8", `Costo por semana y proyecto (${S.length} semanas)`, apiladas(S, T.lideres, "proyectos", sem, false, usd) + leyenda(T.lideres) +
    `<div class="nota">Cada barra empieza en lunes; la última es la semana en curso.</div>`));
  h.push(card("c4", "Proyectos que más cambiaron (7 días)", tabla([["Proyecto", (f) => esc(f.proyecto)], ["Ahora", (f) => usd(f.actual)], ["Antes", (f) => usd(f.anterior)],
    ["Cambio", (f) => `<span class="delta ${f.cambio > 0 ? "sube" : "baja"}">${f.cambio > 0 ? "▲" : "▼"} ${usd(Math.abs(f.cambio))}</span>`]], T.movimientos)));
  if (T.familias.length) h.push(card("c6", "Modelos por semana (% del costo)", apiladas(S, T.familias, "modelos", sem, true, usd) + leyenda(T.familias)));
  h.push(card("c6", "Cuándo trabajas (turnos por hora, 30 días)", calor(T.calor)));
  h.push(card("c6", "Duración del turno por semana", lineas(S.map(sem), [{ nombre: "mediana", valores: S.map((f) => f.dur_p50) }, { nombre: "p90", valores: S.map((f) => f.dur_p90) }], dur) +
    leyenda(["mediana", "p90 (1 de cada 10 turnos tarda más)"])));
  h.push(card("c6", "Turnos y sesiones por semana", lineas(S.map(sem), [{ nombre: "turnos", valores: S.map((f) => f.turnos) }], n) +
    `<div class="nota">Sesiones por semana: ${S.map((f) => n(f.sesiones)).join(" · ")}</div>`));
  const Dd = T.dias.filter((d) => d.turnos);
  if (Dd.length > 1) {
    h.push(card("c6", "Caché y razonamiento por día (30 días)", lineas(Dd.map((d) => d.dia.slice(8) + "/" + d.dia.slice(5, 7)),
      [{ nombre: "entrada desde caché", valores: Dd.map((d) => d.cache_pct) }, { nombre: "razonamiento sobre la salida", valores: Dd.map((d) => d.razon_pct) }], (x) => Math.round(x) + "%", 100) +
      leyenda(["entrada desde caché", "razonamiento sobre la salida"])));
    h.push(card("c6", "Salida por turno, por día (30 días)", lineas(Dd.map((d) => d.dia.slice(8) + "/" + d.dia.slice(5, 7)), [{ nombre: "tokens de salida por turno", valores: Dd.map((d) => d.salida_turno) }], k)));
  }
}

function render() {
  if (!D) { $("#app").innerHTML = `<div class="card c12">Sin datos: corre <code>ws-telemetria build</code>.</div>`; return; }
  $("#gen").textContent = `Actualizado ${D.generado} · se refresca cada ${D.refresco_s} s · costo = equivalente a precios de la API (tu plan Team no cobra por token)`;
  const K = D.kpi, h = [];
  for (const [id, t] of [["hoy", "Hoy"], ["7d", "Últimos 7 días"], ["30d", "Últimos 30 días"]]) {
    h.push(card("c3", t, `<div class="kpi">${usd(K[id].costo)}<small>equiv. API</small></div>
      <div class="fila"><span>${k(K[id].tokens)} tokens</span><span>${n(K[id].turnos)} turnos</span></div>`));
  }
  h.push(card("c3", "Eficiencia", `<div class="kpi">${K.cache_pct}%<small>de la entrada viene de caché</small></div>
    <div class="fila"><span>salida media/turno: ${k(K.salida_por_turno)}</span><span>razonamiento: ${K.razonamiento_pct}%</span></div>
    <div class="fila"><span>prompt medio: ${n(K.prompt_chars_medio)} car.</span><span>subagentes: ${K.subagentes_pct}%</span></div>`));
  h.push(card("c8", "Costo equivalente por día (30 días)", barras(D.dias)));
  const cop = D.copiloto;
  h.push(card("c4", "Copiloto de la terminal", `<div class="kpi">${n(cop.consultas)}<small>consultas</small></div>
    <div class="fila"><span>${k(cop.in)} entrada · ${k(cop.out)} salida</span><span>${usd(cop.costo)}</span></div>`));
  tendencias(D.tendencias, h);
  const RZ = D.razones;
  if (RZ && RZ.razones && RZ.razones.length) {
    h.push(`<div class="seccion">Razones para estimar<small>últimos ${RZ.dias} días · ${n(RZ.turnos)} turnos tuyos · úsalas como unidad al proyectar</small></div>`);
    const fmtv = (f) => (f.unidad === "USD" || f.unidad === "USD/h" ? usd(f.valor) + (f.unidad === "USD/h" ? "/h" : "") : n(f.valor) + (f.unidad === "%" ? " %" : f.unidad === "×" ? " ×" : " " + esc(f.unidad)));
    for (const g of [...new Set(RZ.razones.map((x) => x.grupo))]) {
      h.push(card("c6", g, tabla([["Razón", (f) => esc(f.nombre)], ["Valor", (f) => `<b>${fmtv(f)}</b>`], ["Calculado sobre", (f) => `<span class="sub">${esc(f.base)}</span>`]], RZ.razones.filter((x) => x.grupo === g))));
    }
  }
  otel(D.otel, h);
  h.push(`<div class="seccion">Detalle<small>últimos 30 días, salvo que la tarjeta diga otra cosa</small></div>`);
  h.push(card("c6", "Por proyecto", tabla([
    ["Proyecto", (f) => esc(f.proyecto)], ["Sesiones", (f) => n(f.sesiones)], ["Turnos", (f) => n(f.turnos)],
    ["Nuevo", (f) => k(f.in)], ["Caché", (f) => k(f.cr)], ["Salida", (f) => k(f.out)], ["Costo", (f) => usd(f.costo)], ["Último", (f) => esc(f.ultimo)],
  ], D.proyectos)));
  h.push(card("c6", "Por modelo", tabla([
    ["Modelo", (f) => esc(f.modelo) + (f.estimado ? ` <span class="chip">precio estimado</span>` : "")],
    ["Respuestas", (f) => n(f.respuestas)], ["Entrada", (f) => k(f.in + f.cw)], ["Caché", (f) => k(f.cr)],
    ["Salida", (f) => k(f.out)], ["Razon.", (f) => k(f.think)], ["Costo", (f) => usd(f.costo)],
  ], D.modelos)));
  h.push(card("c8", "Sesiones con más consumo", tabla([
    ["Sesión", (f) => `${esc(f.proyecto)} <span class="chip">${esc(f.sesion)}</span>`], ["Rama", (f) => esc(f.rama)],
    ["Inicio", (f) => esc((f.inicio || "").slice(0, 16).replace("T", " "))], ["Turnos", (f) => n(f.turnos)],
    ["Tokens", (f) => k(f.tokens)], ["Subagentes", (f) => k(f.sub_tokens)], ["Costo", (f) => usd(f.costo)],
  ], D.sesiones)));
  h.push(card("c4", "Herramientas más usadas", tabla([["Herramienta", (f) => esc(f.herramienta)], ["Usos", (f) => n(f.usos)]], D.herramientas)));
  const turnos = D.turnos_recientes.map((t) => {
    const tot = Math.max(1, t.nuevo + t.contexto + t.salida);
    return { ...t, barra: `<div class="barra" title="nuevo ${k(t.nuevo)} · contexto ${k(t.contexto)} · salida ${k(t.salida)}">
      <span style="width:${100 * t.nuevo / tot}%;background:var(--acc)"></span><span style="width:${100 * t.contexto / tot}%;background:var(--bar2)"></span>
      <span style="width:${100 * t.salida / tot}%;background:var(--ok)"></span></div>` };
  });
  h.push(card("c8", "Últimos turnos: lo que preguntas frente a lo que se procesa y responde", tabla([
    ["Inicio", (f) => esc(f.inicio.slice(5, 16).replace("T", " "))], ["Proyecto", (f) => esc(f.proyecto)],
    ["Prompt", (f) => n(f.prompt_chars) + " car."], ["Nuevo", (f) => k(f.nuevo)], ["Contexto", (f) => k(f.contexto)],
    ["Salida", (f) => k(f.salida)], ["Proporción", (f) => `<div style="width:140px">${f.barra}</div>`], ["Costo", (f) => usd(f.costo)],
  ], turnos) + `<div class="leyenda"><span><i style="background:var(--acc)"></i>entrada nueva</span><span><i style="background:var(--bar2)"></i>contexto reusado (caché)</span><span><i style="background:var(--ok)"></i>salida</span></div>`));
  const rec = Object.entries(D.recursos || {}).map(([p, r]) => ({ proyecto: p, ...r })).sort((a, b) => b.cpu_pct - a.cpu_pct);
  h.push(card("c4", "Recursos de Claude por proyecto (24 h)", tabla([
    ["Proyecto", (f) => esc(f.proyecto)], ["CPU", (f) => f.cpu_pct + "%"], ["RAM máx", (f) => n(f.ram_mb) + " MB"],
    ["Ops/s", (f) => f.iops], ["Leído", (f) => f.leidos_mb + " MB"], ["Escrito", (f) => f.escritos_mb + " MB"],
  ], rec) + `<div class="leyenda">Muestras cada minuto del proceso de Claude. La inferencia ocurre en la nube: tu GPU no participa.</div>`));
  const R = D.ruteo;
  if (R) h.push(card("c6", "Ruteo de modelos (30 días)", `<div class="kpi">${R.tasa_aceptacion}%<small>de las sugerencias aceptadas</small></div>
    <div class="fila"><span>${n(R.sugerencias)} sugerencias</span><span>${n(R.aceptado)} aceptadas · ${n(R.rechazado)} no · ${n(R.editar)} editadas</span></div>
    <div class="fila"><span>${n(R.igual)} ya estaban en el nivel correcto</span><span>${n(R.manual)} desde el menú · ${n(R.cr)} con cr</span></div>` +
    tabla([["Regla", (f) => esc(f.regla)], ["Nivel", (f) => esc(f.nivel)], ["Sugerida", (f) => n(f.sugerida)],
           ["Aceptada", (f) => n(f.aceptada)], ["Rechazada", (f) => n(f.rechazada)]], R.reglas)));
  const G = D.telegram;
  if (G) h.push(card("c6", "Telegram (30 días)", `<div class="kpi">${n(G.respuestas)}<small>respuestas desde el celular</small></div>
    <div class="fila"><span>${n(G.enviados)} avisos enviados</span><span>${n(G.cambio)} con la pantalla cambiada · ${n(G.vencido)} vencidos</span></div>
    <div class="fila"><span>${G.no_autorizado ? `<span class="chip">${n(G.no_autorizado)} intentos no autorizados</span>` : "0 intentos no autorizados"}</span><span>${n(G.errores)} errores de envío o de la API</span></div>` +
    tabla([["Cuándo", (f) => esc(f.ts.slice(5, 16).replace("T", " "))], ["Evento", (f) => esc(f.evento)], ["Detalle", (f) => esc(f.detalle)]], G.recientes)));
  const W = D.palabras;
  if (W && W.turnos) h.push(card("c6", "Palabras (30 días)", `<div class="kpi">${n(W.prompt_medio)} → ${n(W.resp_medio)}<small>palabras por turno: lo que escribes → lo que Claude responde</small></div>
    <div class="fila"><span>${n(W.prompt_total)} escritas · ${n(W.resp_total)} respondidas</span><span>${W.resp_por_prompt} palabras de respuesta por cada palabra tuya</span></div>
    <div class="fila"><span>${W.tokens_salida_por_palabra} tokens de salida por palabra visible</span><span>incluye razonamiento y llamadas a herramientas</span></div>` +
    tabla([["Proyecto", (f) => esc(f.proyecto)], ["Turnos", (f) => n(f.turnos)], ["Escritas", (f) => n(f.prompt)], ["Respondidas", (f) => n(f.resp)]], W.proyectos)));
  const N = D.red;
  if (N) h.push(card("c6", "Red (24 h)", `<div class="kpi">↓ ${N.wsl_baja_mb} MB · ↑ ${N.wsl_sube_mb} MB<small>todo WSL, medido (git, npm, az, Claude…)</small></div>
    <div class="fila"><span>${n(N.muestras)} muestras de 1 min</span><span>Claude por proyecto: estimado desde los tokens (~4 bytes por token)</span></div>` +
    tabla([["Proyecto", (f) => esc(f.proyecto)], ["↑ Enviado", (f) => f.sube_mb + " MB"], ["↓ Recibido", (f) => f.baja_mb + " MB"]], N.claude)));
  // Parche 51: trazas, estimación y presupuestos
  const dms = (ms) => ms == null ? "—" : ms >= 60000 ? (ms / 60000).toFixed(1) + " min" : (ms / 1000).toFixed(1) + " s";
  const chips = (l, f) => l.length ? `<div class="leyenda">${l.map((x) => `<span class="chip">${f(x)}</span>`).join("")}</div>` : "";
  const TZ = D.trazas;
  if (TZ) {
    h.push(card("c6", "Herramientas: tiempo, errores y costo (30 días)", `<div class="kpi">${n(TZ.llamadas)}<small>llamadas · ${TZ.error_pct}% con error</small></div>
      <div class="fila"><span>Tu espera para aprobar: ${n(TZ.espera.n)} veces · mediana ${TZ.espera.med_s} s · p95 ${TZ.espera.p95_s} s</span><span>${TZ.espera.total_min} min en total</span></div>` +
      tabla([["Herramienta", (f) => esc(f.nombre)], ["Usos", (f) => n(f.usos)], ["Errores", (f) => n(f.errores)], ["Mediana", (f) => dms(f.med_ms)],
             ["p95", (f) => dms(f.p95_ms)], ["$ aprox.", (f) => usd(f.costo)]], TZ.herramientas.slice(0, 10))));
    h.push(card("c6", "Bash por tipo de trabajo (30 días)", tabla([["Tipo", (f) => esc(f.nombre)], ["Usos", (f) => n(f.usos)], ["Minutos", (f) => f.total_min],
             ["Errores", (f) => n(f.errores)]], TZ.bash_categorias) +
      tabla([["Comando", (f) => esc(f.nombre)], ["Usos", (f) => n(f.usos)], ["Mediana", (f) => dms(f.med_ms)], ["Tipo", (f) => esc(f.categoria)]], TZ.bash.slice(0, 8))));
    h.push(card("c6", "Código: lenguajes y archivos (30 días)", `<div class="fila"><span>${n(TZ.sesiones.commits)} commits en ${n(TZ.sesiones.cerradas)} sesiones cerradas</span>
      <span>+${n(TZ.sesiones.lineas_mas)} / −${n(TZ.sesiones.lineas_menos)} líneas (diff de cada sesión)</span></div>` +
      tabla([["Extensión", (f) => esc(f.ext)], ["Ediciones", (f) => n(f.ediciones)], ["+ líneas", (f) => n(f.lineas_mas)], ["− líneas", (f) => n(f.lineas_menos)]], TZ.lenguajes.slice(0, 6)) +
      tabla([["Archivo", (f) => esc(f.archivo)], ["Ediciones", (f) => n(f.ediciones)], ["+", (f) => n(f.lineas_mas)], ["−", (f) => n(f.lineas_menos)]], TZ.archivos.slice(0, 8))));
    h.push(card("c6", "MCP, subagentes, skills y errores (30 días)",
      tabla([["Servidor MCP", (f) => esc(f.nombre)], ["Usos", (f) => n(f.usos)], ["Errores", (f) => n(f.errores)], ["Mediana", (f) => dms(f.med_ms)],
             ["Métodos", (f) => esc(f.metodos.join(", "))]], TZ.mcp) +
      tabla([["Subagente", (f) => esc(f.nombre)], ["Usos", (f) => n(f.usos)], ["Mediana", (f) => dms(f.med_ms)]], TZ.subagentes) +
      chips(TZ.skills, (x) => `skill ${esc(x.nombre)}: ${x.usos}`) + chips(TZ.errores_tipo, (x) => `error ${esc(x.tipo)}: ${x.n}`) +
      chips(TZ.denegados, (x) => `denegado ${esc(x.accion)}: ${x.n}`) +
      chips(Object.entries(TZ.compactaciones), (x) => `compactación ${esc(x[0])}: ${x[1]}`) +
      chips(TZ.prompts.comandos, (x) => `${esc(x.comando)}: ${x.n}`)));
  }
  const ES = D.estimacion;
  if (ES && ES.length) h.push(card("c12", "Estimación por ticket (90 días)", `<div class="fila"><span>Ticket tomado de la rama (ABC-123). Horas activas = turnos unidos si el hueco es ≤ 15 min.</span>
      <span>Detalle: <code>ws-telemetria estimar</code> · CSV: <code>ws-telemetria exportar</code></span></div>` +
    tabla([["Ticket / rama", (f) => esc(f.clave)], ["Proyecto", (f) => esc(f.proyecto)], ["Horas activas", (f) => f.horas_activas], ["Días", (f) => n(f.dias)],
           ["Turnos", (f) => n(f.turnos)], ["Costo", (f) => usd(f.costo)], ["Modelo", (f) => esc(f.modelo)], ["+/− líneas", (f) => `+${n(f.lineas_mas)}/−${n(f.lineas_menos)}`],
           ["Commits", (f) => n(f.commits)], ["Errores", (f) => n(f.errores)], ["Del", (f) => esc(f.inicio.slice(5))], ["Al", (f) => esc(f.fin.slice(5))]], ES)));
  const PR = D.presupuestos;
  if (PR && PR.length) h.push(card("c6", "Presupuestos del mes", tabla([["Proyecto", (f) => esc(f.proyecto)], ["Gastado", (f) => usd(f.gastado)],
      ["Presupuesto", (f) => usd(f.presupuesto)], ["Uso", (f) => `<span class="${f.pct >= 100 ? "chip" : ""}">${f.pct}%</span>`], ["Proyección", (f) => usd(f.proyeccion)]], PR)));
  h.push(`<footer>Datos locales en ~/.local/share/ws-telemetria (13 meses, sin texto de conversaciones) · consultas propias: <code>ws-telemetria sql</code> · ADR-008</footer>`);
  $("#app").innerHTML = h.join("");
}
render();
</script>
</body>
</html>

# ws-tools.lock — pins of the binaries and Python tools ws-tools installs from upstream releases (WS-SEC-016).
# A binary is installed only when its sha256 equals the one pinned here (reviewed in the kit, not read from the same
# release as the binary); where upstream signs its release, the signature is verified too (sig column):
#   cosign:<checksums file>   keyless cosign signature <file>.keyless.sig and certificate <file>.pem, issued to a
#                             GitHub Actions workflow of the same repository; the checksum file must list the pin
#   none                      upstream publishes no signature: the sha256 pin is the only check
# pypi rows pin an exact version (pipx install <pkg>==<version>); PyPI serves it over TLS with its own hashes.
# A refused download can be installed anyway only with WS_TOOLS_ALLOW_UNVERIFIED=1, which is logged and audited.
# To move a pin: change version and sha256 together (the release's checksum file or the asset digest GitHub shows),
# review the release notes, run bash tests/supply-tools.sh. Versions older than 7 days only (as Dependabot).
#

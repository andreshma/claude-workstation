# es.conf — Spanish language pack of the workstation (active only with `ws-lang es`, ON TOP of en.conf).
#
# The Spanish in this file is DATA, not interface text: these are the words the kit recognises in prompts you
# type in Spanish and in answers Claude writes in Spanish. The interface of the kit stays in English.
#
# Format: key=value, one per line; lines starting with # are comments. The value is everything after the first
# "=" up to the end of the line, taken verbatim: no quoting, no escaping, no trailing comment. Same keys and
# dialects as en.conf (see there); a key may exist only here. The value is appended to the English one (joined
# with "|", or with a space for word lists). Text is compared in lowercase or case-insensitively.

# --- intent-route.sh (grep -E on your prompt in lowercase) ---
intent.design=arquitect|diseñ|disen|amenaza|seguridad|migraci|causa ra
intent.explore=^(busca|dónde|donde|lista|explora|mapea|encuentra|qué hace|que hace)|dónde está|donde esta

# --- tmux-state.sh (grep -Ei on the end of Claude's last message) ---
# state.question: a question opened with the inverted mark anywhere in the closing lines
state.asks=corre|c[oó]rrelo|ejecuta|ejec[uú]talo|p[eé]game|dime|conf[ií]rmame|confirma|decide|elige|p[aá]same|av[ií]same|necesito que|te toca|falta que|aplica|reinicia|abre
state.question=¿[^?]*\?

# --- win-notify.sh (grep -Ei on Claude's text) ---
notify.command=ejecuta|ejecútalo|corre|córrelo|lanza
notify.asks=ejecuta|ejecútalo|ejecutalo|corre|córrelo|correlo|pega|confirma|autoriza|aprueba
notify.question=¿

# --- ws-telegram (Python re in the command extractor; telegram.question is grep -E on the end of the answer) ---
telegram.asks=ejecuta|ejecútalo|ejecutar|ejecutalo|corre|correr|córrelo|correlo|lanza|prueba con
telegram.run_verbs=ejecuta|ejecútalo|ejecutar|corre|correr|córrelo|lanza|prueba con
telegram.bang=antep[oó]n\w*|pon(le|ga|er)?|prefijo|al inicio|delante|empezando con|con
telegram.bang_articles=un|el
telegram.question=¿

# --- ws-audit (Python re, case-insensitive) ---
audit.denied=deneg|no ejecut

# --- ws-report (Python): stop words (space-separated) and the extra letters of a word ---
report.stopwords=al con de del el en es la las lo los mi o para por que se si su te tu un una y ya
report.letters=áéíóúñü

# en.conf — English language pack of the workstation (always active). Read by ~/.local/lib/ws-lang.sh and by
# the small readers inside the Python scripts. Change the language with: ws-lang en | ws-lang es
#
# Format: key=value, one per line; lines starting with # are comments. The value is everything after the first
# "=" up to the end of the line, taken verbatim: no quoting, no escaping, no trailing comment. It is a regular
# expression (a list of alternatives joined with "|", which the consumer wraps in its own group and anchors) or
# a word list, in the dialect of the ONE consumer named in the key. With `ws-lang es` the value of the same key
# in es.conf is appended (joined with "|", or with a space for word lists), so every value must stay valid when
# another alternative follows it. Text is compared in lowercase or case-insensitively: write lowercase.

# --- intent-route.sh (grep -E on your prompt in lowercase): which subagent to suggest ---
intent.design=architect|design|adr|c4|trade-?off|threat|security|owasp|vulnerab|migrat|root cause
intent.explore=^(find|search for|where (is|are|do|does)|list (the|all|every)|explore|map (the|out)|locate|what does)[[:space:]]

# --- tmux-state.sh (grep -Ei on the end of Claude's last message): it asks you to do something ---
state.asks=run this|run it|let me know|tell me|please (confirm|run|share|paste)

# --- win-notify.sh (grep -Ei on Claude's text) ---
# notify.command: verb that precedes a `command` addressed to you · notify.asks: closing request
notify.command=run
notify.asks=run|paste|confirm

# --- ws-telegram (Python re, case-insensitive, in the command extractor) ---
# telegram.asks: the answer asks you to run something · telegram.run_verbs: verb right before an inline `command`
# telegram.bang: words that tell you to put a "!" in front · telegram.bang_articles: article before the "!"
telegram.asks=run|try
telegram.run_verbs=run|try
telegram.bang=prepend\w*|prefix\w*|starting with|with
telegram.bang_articles=a|an|the

# --- ws-audit (Python re, case-insensitive): Claude reports that the sandbox or a rule stopped the command ---
audit.denied=denied|not permitted|permission

# --- ws-report (Python): stop words dropped from recurring prompts (space-separated) and the letters of a word ---
report.stopwords=a an the to of and in on for it is this that with me my no or
report.letters=a-z

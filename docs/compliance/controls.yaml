  evidence:
  - files/home/.claude/settings.json:26-69 (allow list, enumerated; WebFetch only for five documentation domains)
  - files/home/.local/bin/ws-audit:227-228 (fails on dangerous allow wildcards)
  - '''ws-test: settings: no az wildcards in allow and with the deny floor'''
  check:
  - jq -e '[.permissions.allow[] | select(test("^(Bash(\\(\\*\\))?|Bash\\((curl|wget|ssh|scp|rm|sudo|docker|kubectl|az|aws|terraform)[
    :]?\\*?\\))$"))] | length == 0' files/home/.claude/settings.json
  - 'live: ws-test'
  gap: Obsidian read commands are allowed with a trailing wildcard, which also matches extra arguments; acceptable for
    read-only subcommands.
  risk: 'low: allow rules are read-only and reviewed by ws-audit.'
  remediation: Keep.
  effort: S

# Control catalogue for claude-workstation: AI, agent, security and governance controls.
# Phase 1 of the AI security hardening (docs/compliance/assessment.md). Framework sources, versions and the meaning of
# every maps_to prefix are in docs/compliance/frameworks.md. Evidence is file:line in this repository at v3.0.1.
# status: implemented | partial | missing | not-applicable. risk: likelihood x impact for this setup.
# check: a command or test that verifies the control, or none. effort: S (hours), M (days), L (a week or more).
version: 1
kit_version: 3.0.1
assessed: '2026-11-25'
controls:
- id: WS-AI-001
  title: Provenance marking and injection screening of untrusted tool output
  objective: Text that reaches the model from web fetches, MCP servers, converted documents and command output is labelled
    as untrusted data and screened for injection markers before the model acts on it.
  maps_to:
  - OWASP-LLM25:LLM01
  - OWASP-ASI:ASI01
  - OWASP-ASI:ASI06
  - OWASP-MCP3P:client-sandboxing
  - NIST-600-1:Information Security
  - NIST-AI-RMF:MEASURE-2.7
  - NSA-DAISS:Validate the AI system before and during use
  - NSA-AIDATA:BP1
  - WAF-AI:application-design
  - CAF:secure.discover-risks
  - ATLAS:AML.T0051
  - CSF:DE.CM-09
  - OWASP-LLM26:LLM01
  status: partial
  evidence:
  - files/home/.claude/hooks/read-convert.sh:20-21 (converted documents are announced as 'document data, not instructions')
  - files/home/.local/bin/ws-telegram:150 (remote replies are prefixed '[Reply from Telegram]')
  - docs/THREAT_MODEL.md:62-63 (controls are deterministic and do not rely on the model refusing)
  check: none
  gap: WebFetch, WebSearch, MCP results and Bash output carry no provenance label and nothing scans them for injection
    markers (instruction phrases, invisible Unicode tags, zero-width characters).
  risk: 'high: likelihood high (the agent reads web pages, issues, READMEs and two remote MCP servers daily); impact high
    (a hijacked agent acts with the user''s tools).'
  remediation: Add a PostToolUse hook files/home/.claude/hooks/untrusted-content.sh matched on WebFetch|WebSearch|mcp__.*|Bash
    that returns additionalContext naming the source and flags heuristic hits; log hits through audit.sh; register it
    in settings.json and cover it in ws-test.
  effort: M
- id: WS-AI-002
  title: Protection floor present at every protection level
  objective: The deny rules and the PreToolUse guard stay active in full, normal, bare and solo mode, and cannot be removed
    by the level profiles.
  maps_to:
  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI03
  - NIST-AI-RMF:MANAGE-1.3
  - NIST-600-1:Information Security
  - CSF:PR.AA-05
  - CSF:PR.PS-01
  - CIS-v8:4.1
  - WAF-SEC:SE:01
  - WAF-SEC:SE:08
  - NSA-DAISS:Enforce strict access controls
  - NSA-AGENTIC:privilege risks
  - ISO42001:A.9
  - MS-RAI:Reliability and Safety
  - SSDF:PW.9
  - OWASP-LLM26:LLM03
  status: partial
  evidence:
  - files/home/.local/bin/tmux-level:59-78 (full keeps permissions and hooks; bare keeps only deny and hooks)
  - files/home/.config/claude-solo/settings.json:1-5 (solo disables only the sandbox)
  - docs/adr/0013-minimum-protection-floor.md:108-125
  - 'ws-test section ''Protection per tab: full, normal, bare'''
  check: 'ws-test (section ''Protection per tab: full, normal, bare''); jq -e ''.permissions.deny | index("Bash(ws-secret
    get*)")'' files/home/.claude/settings.json'
  gap: The floor lives in user settings and generated profiles, not in a managed policy, and a repository's own .claude/settings*.json
    can still add allow rules and excluded commands at every level.
  risk: 'medium: likelihood low (requires a malicious repository settings file or an edited user file); impact high (the
    floor is what remains in bare and solo).'
  remediation: Ship an optional managed-settings template (files/etc/claude-code/managed-settings.json, installed by install.sh
    --managed with sudo) carrying the deny floor and the guard hook, and make ws-audit warn when a repository .claude/settings*.json
    adds allow rules or excludedCommands.
  effort: M
- id: WS-AI-003
  title: Strict base configuration with levels that add permissions
  objective: The default (normal) level starts from a sandbox without excluded commands and adds exclusions explicitly,
    as ADR 0013 decides.
  maps_to:
  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI03
  - OWASP-NHI:NHI5
  - CSF:PR.AA-05
  - CIS-v8:6.8
  - WAF-SEC:SE:04
  - WAF-SEC:SE:05
  - NSA-DAISS:Ensure a robust deployment environment architecture
  - SSDF:PW.9
  - OWASP-LLM26:LLM03
  status: missing
  evidence:
  - docs/adr/0013-minimum-protection-floor.md:66-81 (decided)
  - docs/adr/0013-minimum-protection-floor.md:122-125 (pending)
  - files/home/.claude/settings.json:817-846 (normal carries 28 excluded commands, including gh, az, git push and terraform)
  check: none
  gap: 'Normal is the user settings as written: az, gh, aws, terraform, kubectl, remote git and obsidian run outside the
    sandbox with the user''s credentials, limited only by permission rules and the guard.'
  risk: 'medium: likelihood medium (normal is the default level and the injection channel is open); impact high (excluded
    commands reach cloud and source control with full credentials).'
  remediation: Move excludedCommands out of files/home/.claude/settings.json into a generated normal profile (tmux-level
    --profile normal) started with --setting-sources project,local like full and bare; add a ws-test case asserting the
    user file has no excludedCommands.
  effort: L
- id: WS-AI-004
  title: Guardrails for autonomous (solo) mode
  objective: Solo mode, which runs Claude in auto permission mode without the sandbox, is bounded in scope, egress, time
    and spend.
  maps_to:
  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI05
  - OWASP-ASI:ASI10
  - NIST-600-1:Human-AI Configuration
  - NIST-AI-RMF:MAP-3.5
  - NIST-AI-RMF:MANAGE-2.4
  - NSA-AGENTIC:privilege risks
  - CSF:PR.AA-05
  - ISO42001:A.9
  - MS-RAI:Accountability
  - OWASP-LLM26:LLM03
  status: partial
  evidence:
  - files/home/.local/bin/tmux-solo:3-8,17 (auto mode with a sandbox-off profile; ask, deny and guard remain)
  - files/home/.local/bin/ws-audit:278-280 (checks the solo profile only disables the sandbox)
  - files/home/.local/bin/ws-telegram:285-287,405 (no remote run in solo tabs)
  - ws-test section 'Solo mode'
  check: ws-test (section 'Solo mode'); ws-audit (pillar Sandbox, 'solo mode profile')
  gap: Solo mode has no network egress control, no filesystem confinement outside the worktree option, no session time
    limit and no spend cap; it relies on the auto-mode classifier for everything not in ask or deny.
  risk: 'high: likelihood medium (solo is used to let the agent work unattended on untrusted content); impact high (no
    sandbox: credential paths outside the deny list, any host reachable).'
  remediation: Change files/home/.config/claude-solo/settings.json to keep sandbox.enabled true with autoAllowBashIfSandboxed
    so commands run without prompts but inside bubblewrap and the network allowlist; default tmux-solo new to the worktree
    variant; add an expiry (@csolo_until) that tmux-watch reverts; test in ws-test.
  effort: M
- id: WS-AI-005
  title: Human approval for consequential actions
  objective: Mutating cloud, infrastructure, database, container, Windows-shell and MCP actions always ask the user, even
    after a 'do not ask again' answer.
  maps_to:
  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI09
  - NIST-600-1:Human-AI Configuration
  - NIST-AI-RMF:MAP-3.5
  - NIST-AI-RMF:GOVERN-3.2
  - NSA-AGENTIC:accountability risks
  - CSF:PR.AA-05
  - ISO42001:A.9
  - MS-RAI:Accountability
  - OWASP-MCP3P:authorization
  - CAF:govern.enforce-policies
  - OWASP-LLM26:LLM03
  status: implemented
  evidence:
  - 'files/home/.claude/settings.json:149-247 (ask list: aws, azd, terraform, kubectl, helm, docker, databases, pwsh,
    cmd.exe, wsl.exe, Azure, Microsoft 365 and MemPalace delete tools)'
  - ws-test 'the MCP tools that send, delete or touch secrets, and PowerShell, always ask for confirmation'
  check: 'ws-test (section ''Status bar: personal segments and ws-cache''); jq -e ''.permissions.ask | index("Bash(terraform
    apply*)") and index("mcp__azure__*delete*")'' files/home/.claude/settings.json'
  gap: Rules are prefix and glob patterns; an equivalent command written differently can miss them (documented residual).
  risk: 'low: the residual is documented in docs/THREAT_MODEL.md and partly covered by the guard.'
  remediation: Keep; extend with WS-AI-006 so the number of prompts stays reviewable.
  effort: S
- id: WS-AI-006
  title: Approval fatigue monitoring
  objective: The number and outcome of permission prompts is measured and the user is warned when approval volume or blanket
    approvals suggest rubber-stamping.
  maps_to:
  - OWASP-ASI:ASI09
  - NIST-600-1:Human-AI Configuration
  - NIST-AI-RMF:MEASURE-2.8
  - NIST-AI-RMF:MEASURE-3.1
  - NSA-AGENTIC:accountability risks
  - CSF:DE.CM-03
  - ISO42001:A.9
  - WAF-AI:operations
  status: partial
  evidence:
  - files/home/.local/bin/ws-otel:11 (every permission decision and who made it is stored)
  - ws-test 'the dashboard adds up latency, errors per code, permissions and active time'
  check: ws-test (section 'Local OpenTelemetry collector (ws-otel)')
  gap: Accept and reject counts are shown on the dashboard, but there is no threshold, no alert and no report of 'always
    allow' grants or of approvals given within a second of the prompt.
  risk: 'medium: likelihood medium (more than 90 ask rules plus Claude''s default prompts, several tabs and a phone channel);
    impact medium (a rubber-stamped approval defeats WS-AI-005).'
  remediation: Add a 'prompts' section to ws-telemetry build (approvals per hour, median time to approve, share approved
    under 2 s, new permanent allow rules found in ~/.claude/settings.local.json files) and an alert in ws-telegram's minute
    loop above a configurable rate.
  effort: M
- id: WS-AI-007
  title: Remote approval channel authentication
  objective: Answers to Claude from the phone are accepted only from the owner, once, before expiry, for the dialog that
    is still on screen, and approvals of risky dialogs need a second factor.
  maps_to:

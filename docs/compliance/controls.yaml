  - files/home/.local/bin/ws-telegram:33,750-756 (one-time code, 10 min expiry)
  - files/home/.local/bin/ws-telegram:794-799 (screen re-read before sending a key)
  - files/home/.local/bin/ws-telegram:91-101,127-134 (PIN, three failures)
  - docs/adr/0010-telegram-remote-control.md
  check: 'ws-test (section ''Telegram: notifications and answering with buttons (simulated API)'')'
  gap: Buttons that answer a permission dialog (including 'yes, and do not ask again') send the key without the PIN; only
    ▶ Run and free text require it.
  risk: 'medium: likelihood low (needs the unlocked phone or the bot token); impact high (approves an ask-rule action
    such as terraform apply from outside the machine).'
  remediation: In ws-telegram handle_button, require the PIN reply flow (to-run state) when the dialog text matches an

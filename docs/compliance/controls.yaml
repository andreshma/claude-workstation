  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI03
  - NIST-AI-RMF:MANAGE-1.3
  - NIST-600-1:Information Security
  - CSF:PR.AA-05
  - CSF:PR.PS-01
  - CIS-v8:4.1
  - WAF-SEC:SE:01
  - WAF-SEC:SE:08
  - NSA-DAISS:Enforce strict access controls
  - NSA-AGENTIC:privilege risks
  - ISO42001:A.9
  - MS-RAI:Reliability and Safety
  - SSDF:PW.9
  - OWASP-LLM26:LLM03
  - MCSB:PV-1
  - ISO25010:Safety
  status: implemented
  evidence:
  - files/home/.local/bin/tmux-level:88-117 (full keeps permissions and hooks; bare keeps deny,
    disableBypassPermissionsMode and hooks; solo is generated from the solo profile with normal's exclusions as ask rules, ADR-022)
  - files/home/.claude/settings.json:325 (bypassPermissions mode disabled at every level)
  - 'files/home/.claude/settings.json:512-522 (guard hook with onFailure block: a missing or crashing guard blocks)'
  - 'files/etc/claude-code/managed-settings.json (managed drop-in: deny floor, guard as root, bypass disabled)'
  - install.sh:230-268 (install.sh --managed installs it to /etc/claude-code/managed-settings.d/50-ws-kit.json)
  - files/home/.local/bin/ws-audit:260-303 (reads managed-settings.json and every drop-in of managed-settings.d, the
    kit's 50-ws-kit.json included; fails on invalid JSON, a file not owned by root or a drop-in that lost its floor)
  - files/home/.local/bin/ws-audit:458-470 (warns about repository .claude settings that add allow rules or excluded
    commands at every level)
  - docs/adr/0013-minimum-protection-floor.md
  check:
  - bash tests/hooks-settings.sh
  - bash tests/guard.sh
  - bash tests/audit-mcp.sh
  - 'live: ws-test'
  gap: The managed drop-in is opt-in (install.sh --managed, sudo) and has not been verified as root on a live machine;
    without it the floor lives in user settings, which the guard protects from the agent but the owner can edit. A repository's
    .claude settings that widen every level are reported by ws-audit, not blocked.
  risk: 'medium: likelihood low (requires a malicious repository settings file or an edited user file); impact high (the
    floor is what remains in bare and solo).'
  remediation: Install the managed drop-in on every workstation and verify it with claude doctor; consider allowManagedHooksOnly
    and a managed permissions floor once verified.
  effort: M
- id: WS-AI-003
  title: Strict base configuration with levels that add permissions
  objective: The default (normal) level starts from a sandbox without excluded commands and adds exclusions explicitly,
    as ADR 0013 decides.

  - 'files/home/.local/bin/tmux-solo:44-55 (network tools: 1 h by default, 4 h at most, never with --unsandboxed)'
  - files/home/.local/bin/tmux-solo:60-67 (marks @csolo_until and @csolo_net; audit events solo-on, solo-network-tools,
    solo-unsandboxed)
  - files/home/.local/bin/tmux-watch:15,69-75 (returns an expired solo tab to normal)
  - files/home/.local/bin/ws-audit:478-495 (fails when solo.json excludes a command or solo-net.json excludes one
    without its ask rule)
  - files/home/.local/bin/ws-telegram:385-393 (nothing is offered or run from Telegram in a solo or bare tab)
  - docs/adr/0016-solo-mode-inside-the-sandbox.md
  - docs/adr/0022-solo-mode-without-excluded-commands.md
  check:
  - bash tests/solo-sandbox.sh
  - 'live: ws-test'
  gap: 'Residual: WebFetch to the five documentation domains and MCP servers (the jailed ones with --net) keep their own
    egress in solo; --unsandboxed and --with-network-tools remain as audited, time-boxed exceptions; a repository''s

- id: WS-AI-012
  title: Memory write gate for MemPalace
  objective: Writes to persistent memory happen only with the user's approval and carry their source, so a poisoned page
    or file cannot plant instructions that later sessions trust.
  maps_to:
  - OWASP-ASI:ASI06
  - OWASP-LLM25:LLM04
  - OWASP-LLM25:LLM08
  - NIST-600-1:Information Integrity
  - NIST-600-1:Information Security
  - NIST-AI-RMF:MEASURE-2.7
  - NSA-AIDATA:BP1
  - NSA-AIDATA:BP2
  - ATLAS:AML.T0080
  - ATLAS:AML.T0080.000
  - OWASP-MCP3P:authorization
  - CSF:PR.DS-10
  - ISO42001:A.7
  - WAF-AI:grounding-data-design
  - OWASP-LLM26:LLM05
  - OWASP-LLM26:LLM09
  status: partial
  evidence:
  - files/home/.local/bin/ws-learn:86-105 (facts are proposed read-only and saved only after the user picks them)
  - files/home/.claude/settings.json:244-246 (only MemPalace delete, invalidate and supersede ask)
  - files/home/.claude/settings.json:409-425,530-545,707-724 (MemPalace hooks on SessionEnd, Stop and PreCompact receive
    the transcript)
  check: jq -e '.permissions.ask | index("mcp__mempalace__*delete*")' files/home/.claude/settings.json
  gap: MemPalace write tools (mempalace_kg_add, mempalace_add_drawer, mempalace_diary_write and others) are not in the
    always-ask list, so after one 'do not ask again' answer, or under solo's auto mode, the agent writes memory without
    asking; the lifecycle hooks also hand every transcript to MemPalace, and what it stores from them is decided outside
    this repository.
  risk: 'high: likelihood medium (indirect injection only needs one successful write); impact high (the user''s global
    instructions tell every session to consult memory first, so a planted fact persists and spreads).'
  remediation: Add ask rules mcp__mempalace__*add*, *write*, *update*, *put*, *mine*, *patch*, *create*, *sync* to settings.json;
    give ws-learn a --settings profile that allows only mempalace_kg_add so its approved flow still works headless; document
    in the AI-BOM what the hooks send and keep (WS-GOV-002).
  effort: S

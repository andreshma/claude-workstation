  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - CSF:PR.AA-05
  - CIS-v8:2.7
  - WAF-SEC:SE:05
  - SSDF:PW.9
  - OWASP-LLM26:LLM03
  - MCSB:PA-7

  risk: 'medium: likelihood low (no credentialed network tool runs without a human in solo; an injection must get past
    the sandbox or an ask prompt); impact high (solo works unattended).'
  remediation: Keep the residual under the quarterly review; block repository-added excluded commands in solo if
    ws-audit ever reports one.
  effort: M

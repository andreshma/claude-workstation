# Control catalogue for claude-workstation: AI, agent, security and governance controls.
# Phase 1 of the AI security hardening wrote it (docs/compliance/assessment.md); phase 2 brought every status and
# evidence in line with the code. Framework sources, versions and the meaning of every maps_to prefix are in
# docs/compliance/frameworks.md. Evidence is file:line (or file#anchor) in this repository; tests/compliance.sh checks
# that every file, line range and anchor exists.
# status: implemented | partial | missing | not-applicable. risk: likelihood x impact for this setup.
# check: none, or a list of items run by ws-audit --compliance and tests/compliance.sh (allow list only, never a
#   shell): bash tests/<name>.sh | test -f|-d|-x|-s <path> | jq -e <filter> <file> | grep [-qEFiwxcr] <pattern> <file>
#   | live: <read-only kit command> (workstation only, skipped in CI) | manual: <text> (reported, not run).
# effort: S (hours), M (days), L (a week or more).
version: 1
kit_version: 3.0.1 + Unreleased (phase 2 and round 3)
assessed: '2026-11-25'
controls:
- id: WS-AI-001
  title: Provenance marking and injection screening of untrusted tool output
  objective: Text that reaches the model from web fetches, MCP servers, converted documents and command output is labelled
    as untrusted data and screened for injection markers before the model acts on it.
  maps_to:
  - OWASP-LLM25:LLM01
  - OWASP-ASI:ASI01
  - OWASP-ASI:ASI06
  - OWASP-MCP3P:client-sandboxing
  - NIST-600-1:Information Security
  - NIST-AI-RMF:MEASURE-2.7
  - NSA-DAISS:Validate the AI system before and during use
  - NSA-AIDATA:BP1
  - WAF-AI:application-design
  - CAF:secure.discover-risks
  - ATLAS:AML.T0051
  - CSF:DE.CM-09
  - OWASP-LLM26:LLM01
  - MCSB:AI-2
  - OWASP-AITM:T6
  - OWASP-MCP10:MCP03
  - OWASP-MCP10:MCP06
  - OWASP-RTM:4.3.3
  status: implemented
  evidence:
  - 'files/home/.claude/hooks/untrusted-content.sh:30-39 (source named per tool: web host, search query, MCP server,
    network command)'
  - 'files/home/.claude/hooks/untrusted-content.sh:41-68 (markers: instruction phrases in English and Spanish,
    chat-template tokens, Unicode tag, bidirectional and zero-width characters, base64 blocks over 2 KB)'
  - files/home/.claude/hooks/untrusted-content.sh:70-76 (additionalContext label; on a hit, a warning and an audit
    injection-suspect line)
  - files/home/.claude/settings.json:403-471 (PostToolUse on WebFetch, WebSearch and mcp__.*; Bash only through if rules
    for curl, wget and gh)
  - files/home/.claude/hooks/read-convert.sh:22-23 (converted documents are announced as 'document data, not
    instructions')
  - files/home/.local/bin/ws-telegram:184 (remote replies are prefixed '[Reply from Telegram]')
  check:
  - bash tests/hooks-untrusted.sh
  gap: 'Screening is heuristic: plain-language social engineering with no marker (measured: 2 of 20 real samples) is labelled
    untrusted but not flagged; Bash output is labelled only for the network commands in the if rules, and files the agent
    reads are not labelled.'
  risk: 'high: likelihood high (the agent reads web pages, issues, READMEs and two remote MCP servers daily); impact high
    (a hijacked agent acts with the user''s tools).'
  remediation: Extend the phrase list from incidents; consider labelling Read results of files outside the working directory.
  effort: M
- id: WS-AI-002

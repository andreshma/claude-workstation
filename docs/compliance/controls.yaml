  - OWASP-LLM25:LLM06
  - OWASP-ASI:ASI02
  - OWASP-ASI:ASI03
  - OWASP-NHI:NHI5
  - CSF:PR.AA-05
  - CIS-v8:6.8
  - WAF-SEC:SE:04
  - WAF-SEC:SE:05
  - NSA-DAISS:Ensure a robust deployment environment architecture
  - SSDF:PW.9
  - OWASP-LLM26:LLM03
  - MCSB:PA-7
  - MCSB:AI-4
  - OWASP-AITM:T3
  status: implemented
  evidence:
  - 'files/home/.claude/settings.json:963-1033 (the user settings carry the sandbox with no excludedCommands: a
    hand-typed claude runs strict)'
  - files/home/.config/claude-levels/normal-adds.json:1-34 (the commands the normal level excludes from the sandbox)
  - files/home/.local/bin/tmux-level:11-24,135-142,194 (normal = claude-resume --settings normal.json, generated from
    normal-adds.json)
  - files/home/.local/bin/claude-resume:8-10,18-20 (with no --settings or --setting-sources it starts at the normal
    level)
  - files/home/.local/bin/ws-audit:448-451 (warns when the user settings exclude commands)
  - docs/adr/0013-minimum-protection-floor.md
  check:
  - jq -e '.sandbox.excludedCommands == null' files/home/.claude/settings.json
  - jq -e '.sandbox.excludedCommands | length > 0' files/home/.config/claude-levels/normal-adds.json
  - bash tests/solo-sandbox.sh
  - 'live: ws-test'
  gap: How --settings merges sandbox.excludedCommands with the other settings sources has not been verified at runtime
    (if it does not merge, the normal level is stricter, not looser). Excluded commands still use the user's own credentials
    (WS-AI-026).
  risk: 'medium: likelihood medium (normal is the default level and the injection channel is open); impact high (excluded
    commands reach cloud and source control with full credentials).'
  remediation: Verify the merge with claude doctor and a live normal tab after each Claude Code major release.
  effort: L

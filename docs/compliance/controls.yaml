- id: WS-AI-009
  title: 'MCP server supply chain: pinning and integrity'
  objective: Every MCP server the kit registers runs a pinned, integrity-checked, non-prerelease version from a known
    source.
  maps_to:
  - OWASP-LLM25:LLM03
  - OWASP-ASI:ASI04
  - OWASP-NHI:NHI3
  - OWASP-MCP3P:secure-server-discovery
  - NIST-600-1:Value Chain and Component Integration
  - NIST-AI-RMF:GOVERN-6.1
  - NIST-AI-RMF:MANAGE-3.1
  - NIST-AI-RMF:MAP-4.2
  - SSDF:PW.4
  - SSDF-218A:PW.4
  - CSF:GV.SC-07
  - CSF:ID.RA-09
  - CIS-v8:16.5
  - CIS-v8:2.2
  - WAF-SEC:SE:02
  - NSA-DAISS:Validate the AI system before and during use
  - CAF:govern.document-policies
  - ISO42001:A.10
  - OWASP-LLM26:LLM04
  status: partial
  evidence:
  - files/mcp-servers.json:30-37 (azure pinned to @azure/mcp@4.0.0-beta.7 through npx -y)
  - files/mcp-servers.json:2-24 (mempalace and recall run local Windows executables; HF_HUB_OFFLINE=1)
  - files/mcp-servers.json:26-29,41-44 (two remote HTTP servers)
  - files/home/.local/bin/ws-update:9-12 (reports a new azure version)
  - install.sh:163-173 (registers servers whose executable exists)
  check: jq -e '.azure.args | any(test("@azure/mcp@[0-9]"))' files/mcp-servers.json
  gap: The Azure server is a beta resolved by npx without an integrity hash or lockfile for its dependencies, the local
    executables have no checksum, and ws-update's version parser drops the prerelease suffix (ws-update:10), so it compares
    4.0.0 with npm's latest.
  risk: 'high: likelihood medium (npm and MCP packages are an active attack target); impact high (MCP servers run outside
    the sandbox with the user''s Azure credentials).'
  remediation: Install @azure/mcp into a kit-managed prefix with a committed package-lock.json (npm ci --ignore-scripts)
    and point mcp-servers.json at that binary; prefer a stable release; record a sha256 for each local MCP executable
    in a files/mcp-servers.lock checked by install.sh and ws-audit; fix the parser in ws-update.
  effort: M
- id: WS-AI-010
  title: MCP server registration control

  gap: No deny rule covers 'claude mcp add' or edits to ~/.claude.json, no managed allowedMcpServers list is shipped,
    and nothing checks enableAllProjectMcpServers or enabledMcpjsonServers.
  risk: 'medium: likelihood low (requires the agent to be steered into adding a server, or a malicious repo .mcp.json
